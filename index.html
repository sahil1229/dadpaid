<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#d6ad32" />
<title>Dad Paid</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Funnel+Display:wght@600;700;800;900&family=Funnel+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="favicon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Dad Paid" />
<meta name="mobile-web-app-capable" content="yes" />
<style>
  /* ─────────────────────────── BASE ─────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Funnel Sans', system-ui, -apple-system, sans-serif;
    background: #0e0e0e;
    color: #0e0e0e;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  input { font: inherit; color: inherit; }

  /* ─────────────────────────── STAGE & PHONE ─────────────────────────── */
  /* DEFAULT = full-bleed phone. The desktop "phone frame" is opt-in via
     min-width media query below. This guarantees ANY phone (small, large,
     foldable) just fills the screen rather than sitting in a tiny iframe. */
  .stage {
    width: 100vw;
    min-height: 100vh;
    min-height: 100svh;
    min-height: 100dvh;
    background: #0e0e0e;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    overflow: hidden;
  }
  .phone {
    width: 100vw;
    height: 100vh;
    height: 100svh;
    height: 100dvh;
    flex-shrink: 0;
    border-radius: 0;
    overflow: hidden;
    position: relative;
    background: #fffaf0;
    box-shadow: none;
  }
  .island, .home-bar { display: none; }
  .header { padding-top: calc(env(safe-area-inset-top) + 8px); }
  .nav { padding-bottom: max(16px, env(safe-area-inset-bottom)); }

  .screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: #fffaf0; color: #0e0e0e;
    font-weight: 500;
    overflow: hidden;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  .screen *::-webkit-scrollbar { display: none; }
  .screen * { scrollbar-width: none; }

  /* Tablet / desktop preview — only on genuinely large screens. Shows the
     iPhone-frame mock for design review. Below this threshold = real app. */
  @media (min-width: 700px) and (min-height: 720px) and (orientation: portrait),
         (min-width: 900px) and (min-height: 720px) {
    .stage { padding: 24px; }
    .phone {
      width: 402px; height: 874px;
      max-height: calc(100dvh - 48px);
      border-radius: 48px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35), 0 0 0 4px #1a1a1a, 0 0 0 5px #2a2a2a;
    }
    .island {
      display: block;
      position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
      width: 126px; height: 37px; border-radius: 24px; background: #000;
      z-index: 50; pointer-events: none;
    }
    .home-bar {
      display: block;
      position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
      width: 139px; height: 5px; border-radius: 100px;
      background: rgba(14,14,14,0.3); z-index: 60; pointer-events: none;
    }
    .header { padding-top: 14px; }
    .nav { padding-bottom: 22px; }
  }

  /* Compact heights (iPhone SE, Mini, small Androids, fold-folded). */
  @media (max-height: 740px) {
    .key { font-size: 22px; box-shadow: 2px 2px 0 #0e0e0e; }
    .key:active { box-shadow: 1px 1px 0 #0e0e0e; }
    .kp-amount { font-size: 36px; }
    .kp-amount .sym { font-size: 24px; }
    .ava-lg { width: 42px; height: 42px; font-size: 15px; }
    .kp-pad { padding: 8px 10px 12px; gap: 5px; }
    .cta { padding: 10px; font-size: 17px; box-shadow: 3px 3px 0 #0e0e0e; }
  }
  @media (max-height: 640px) {
    .key { font-size: 20px; min-height: 32px; }
    .kp-amount { font-size: 30px; line-height: 1; }
    .kp-amount .sym { font-size: 20px; }
    .ava-lg { width: 36px; height: 36px; font-size: 13px; }
    .kp-pad { padding: 6px 8px 10px; gap: 4px; }
    .kp-top { padding: 8px 14px 6px; }
    .kp-payers { padding: 6px 14px; }
    .kp-card-bar { padding: 6px 14px; font-size: 10px; }
    .cta { padding: 8px; font-size: 15px; }
    .h-title { font-size: 20px; }
    .h-sub { font-size: 10px; margin-top: 3px; }
    .header { padding: 8px 18px 8px; }
    .nav { padding: 8px 14px max(10px, env(safe-area-inset-bottom)); }
  }

  /* Narrow widths (sub-360px: small Androids, Galaxy A 5.5"). */
  @media (max-width: 360px) {
    .header, .row, .led-row, .tom-event, .tom-vault-item, .settings-row, .settings-action,
    .sum-cat-row, .sum-who-row, .section-band, .section-band-dark, .led-day-band {
      padding-left: 16px; padding-right: 16px;
    }
    .kp-top, .kp-payers, .kp-card-bar { padding-left: 14px; padding-right: 14px; }
    .kp-cats { padding-left: 14px; padding-right: 14px; margin-left: -14px; margin-right: -14px; }
    .h-title { font-size: 22px; }
    .kp-amount { font-size: clamp(28px, 9vw, 44px); }
  }

  /* Landscape on a phone: keypad is wrong shape, just ask to rotate.
     Triggers when height is short AND device is landscape (avoids triggering
     on a portrait phone with the keyboard up). */
  @media (max-height: 500px) and (orientation: landscape) {
    .rotate-prompt {
      position: fixed; inset: 0;
      background: #0e0e0e; color: #e9c44b;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px;
      z-index: 999;
      padding: 24px;
      text-align: center;
    }
    .rotate-prompt .glyph {
      font-size: 40px;
      animation: rotateHint 2.4s ease-in-out infinite;
    }
    .rotate-prompt .lbl {
      font-family: 'Funnel Display'; font-weight: 800;
      font-size: 18px; letter-spacing: 0.08em; text-transform: uppercase;
    }
    .rotate-prompt .sub {
      font-size: 12px; color: rgba(233,196,75,0.7);
      letter-spacing: 0.06em;
    }
    @keyframes rotateHint {
      0%, 100% { transform: rotate(-15deg); }
      50%      { transform: rotate(15deg); }
    }
  }
  @media not (max-height: 500px) and (orientation: landscape) {
    .rotate-prompt { display: none; }
  }
  .rotate-prompt { display: none; }
  @media (max-height: 500px) and (orientation: landscape) {
    .rotate-prompt { display: flex; }
    .stage .phone { filter: blur(6px); pointer-events: none; }
  }

  /* ─────────────────────────── HEADER ─────────────────────────── */
  .header {
    background: #0e0e0e; color: #fffaf0;
    padding: 14px 22px 12px;
    flex-shrink: 0;
  }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .h-title {
    font-family: 'Funnel Display'; font-weight: 800;
    font-size: clamp(20px, 6vw, 26px);
    letter-spacing: -0.01em; line-height: 1;
    color: #e9c44b;
  }
  .h-sub {
    margin-top: 5px; font-size: 11px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: rgba(255,250,240,0.65);
  }
  .h-right {
    font-family: 'Funnel Display'; font-weight: 700; font-size: 13px;
    letter-spacing: 0.08em; text-align: right;
    color: #e9c44b; line-height: 1.2;
  }
  .h-right-sub { color: rgba(255,250,240,0.55); font-weight: 500; font-size: 10px; margin-top: 4px; }
  .h-offline {
    display: inline-flex; align-items: center; gap: 5px;
    background: #c0392b; color: #fffaf0;
    padding: 3px 8px; border-radius: 999px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    margin-top: 4px;
  }
  .h-offline .pulse { width: 5px; height: 5px; border-radius: 50%; background: #fffaf0; }
  .led-row-unsynced .led-row-amt::after {
    content: '·'; display: inline-block; color: #c0392b; margin-left: 4px;
    font-weight: 800;
  }

  /* ─────────────────────────── BOTTOM NAV ─────────────────────────── */
  .nav {
    flex-shrink: 0;
    background: #0e0e0e;
    padding: 12px 18px 22px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: rgba(233, 196, 75, 0.55);
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
    transition: color 0.1s;
  }
  .nav-btn.active { color: #e9c44b; }
  .nav-btn:active { transform: translateY(1px); }
  .nav-btn svg { display: block; }

  /* ─────────────────────────── CONTENT BODY ─────────────────────────── */
  .body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

  /* ─────────────────────────── SHARED ─────────────────────────── */
  .section-band {
    background: #e9c44b;
    padding: 10px 22px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: #0e0e0e;
    border-top: 2px solid #0e0e0e; border-bottom: 2px solid #0e0e0e;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .section-band-dark {
    background: #0e0e0e; color: #e9c44b;
    padding: 8px 22px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }
  .row {
    padding: 14px 22px;
    background: #fffaf0;
    border-bottom: 1.5px solid rgba(14,14,14,0.08);
    display: flex; align-items: center; gap: 14px;
  }
  .row-alt { background: #f1ecdf; }
  .row:last-child { border-bottom: none; }

  /* avatars */
  .ava {
    width: 36px; height: 36px; border-radius: 50%;
    background: #0e0e0e; color: #e9c44b;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Funnel Display'; font-weight: 700; font-size: 14px;
    flex-shrink: 0;
  }
  .ava-lg {
    width: clamp(40px, 14vw, 56px);
    height: clamp(40px, 14vw, 56px);
    font-size: clamp(15px, 5vw, 22px);
  }
  .ava-outline {
    background: transparent; color: #0e0e0e;
    border: 2px solid #0e0e0e;
  }

  /* chips & pills */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    background: transparent; color: #0e0e0e;
    border: 2px solid #0e0e0e;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: transform 0.04s, box-shadow 0.04s;
    cursor: pointer;
  }
  .chip-active { background: #0e0e0e; color: #e9c44b; }
  .chip-mustard { background: #e9c44b; color: #0e0e0e; }
  .chip:active { transform: translate(1px, 1px); }

  /* keypad keys — fill grid cell, never overflow */
  .key {
    background: #fffaf0; color: #0e0e0e;
    border: 2px solid #0e0e0e;
    border-radius: 4px;
    box-shadow: 3px 3px 0 #0e0e0e;
    font-family: 'Funnel Display'; font-weight: 800; font-size: 26px;
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.04s, box-shadow 0.04s;
    cursor: pointer;
    user-select: none;
  }
  .key:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #0e0e0e;
  }
  .key-mustard { background: #e9c44b; }

  /* large CTA */
  .cta {
    background: #e9c44b; color: #0e0e0e;
    border: 2px solid #0e0e0e;
    border-radius: 4px;
    box-shadow: 4px 4px 0 #0e0e0e;
    font-family: 'Funnel Display'; font-weight: 800; font-size: 20px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 14px;
    width: 100%;
    transition: transform 0.04s, box-shadow 0.04s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .cta:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #0e0e0e; }
  .cta-disabled { background: rgba(233,196,75,0.5); color: rgba(14,14,14,0.4); box-shadow: 4px 4px 0 rgba(14,14,14,0.2); pointer-events: none; }

  /* ─────────────────────────── KEYPAD SCREEN ─────────────────────────── */
  .kp-body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .kp-top {
    padding: 12px 18px 10px; background: #fffaf0;
    border-bottom: 2px solid #0e0e0e;
    flex-shrink: 0;
  }
  .kp-amount {
    font-family: 'IBM Plex Mono'; font-weight: 700;
    font-size: clamp(28px, 9vw, 48px); line-height: 1;
    letter-spacing: -0.03em; color: #0e0e0e;
    display: flex; align-items: baseline; gap: 4px;
    margin: 0 0 8px;
  }
  .kp-amount.zero { color: rgba(14,14,14,0.25); }
  .kp-amount .sym { font-size: 30px; opacity: 0.55; }
  .kp-clear { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: rgba(14,14,14,0.5); }
  .kp-toprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kp-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .kp-cats {
    display: flex; gap: 6px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    padding: 2px 18px;
    margin: 8px -18px 0;
    -webkit-overflow-scrolling: touch;
  }
  .kp-cats::-webkit-scrollbar { display: none; }
  .kp-cat {
    flex-shrink: 0;
    scroll-snap-align: start;
    padding: 6px 12px;
    border: 2px solid #0e0e0e;
    border-radius: 999px;
    background: transparent; color: #0e0e0e;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.04s, box-shadow 0.04s, background 0.04s;
  }
  .kp-cat:active { transform: translate(1px, 1px); }
  .kp-cat.active { background: #e9c44b; box-shadow: 2px 2px 0 #0e0e0e; }
  .kp-sym-btn {
    background: transparent; padding: 0; cursor: pointer;
    font: inherit; color: inherit;
  }
  .kp-payers {
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 18px;
    background: #fffaf0;
    flex-shrink: 0;
  }
  .kp-payer { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .kp-payer-name { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(14,14,14,0.5); }
  .kp-payer.active .kp-payer-name { color: #0e0e0e; }
  .kp-card-bar {
    background: #0e0e0e; color: #e9c44b;
    padding: 8px 18px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .kp-card-bar .swap { color: rgba(233,196,75,0.7); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; }
  .kp-pad {
    background: #e9c44b;
    padding: 12px 14px 14px;
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr) auto;
    gap: 7px;
    min-height: 0;
    overflow: hidden;
  }
  .kp-cta { grid-column: 1 / -1; margin-top: 4px; }

  /* ─────────────────────────── LEDGER (timeline) ─────────────────────────── */
  .led-filters { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 2px solid #0e0e0e; }
  .led-filter {
    padding: 12px 8px; text-align: center;
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(14,14,14,0.5);
    border-right: 1.5px solid rgba(14,14,14,0.12);
    background: #fffaf0;
  }
  .led-filter:last-child { border-right: none; }
  .led-filter.active { background: #e9c44b; color: #0e0e0e; }
  .led-day-band {
    background: #e9c44b; border-top: 2px solid #0e0e0e; border-bottom: 2px solid #0e0e0e;
    padding: 8px 22px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .led-day-band.dim { background: #f1ecdf; }
  .led-day-band .lbl { font-family: 'Funnel Display'; font-weight: 800; font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; }
  .led-day-band .sub { font-size: 10px; color: rgba(14,14,14,0.55); font-weight: 600; letter-spacing: 0.04em; }
  .led-day-band .total { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 16px; }
  .led-row { display: flex; gap: 12px; align-items: center; padding: 12px 22px; background: #fffaf0; border-bottom: 1.5px solid rgba(14,14,14,0.07); transition: background 0.4s; }
  .led-row.fresh { background: #fff5d6; animation: freshFlash 1.4s ease-out; }
  @keyframes freshFlash {
    0%   { background: #e9c44b; }
    100% { background: #fffaf0; }
  }
  .led-row-title { font-size: 14px; font-weight: 600; line-height: 1.2; }
  .led-row-sub { font-size: 11px; color: rgba(14,14,14,0.55); font-weight: 500; margin-top: 3px; letter-spacing: 0.02em; }
  .led-row-amt { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 16px; text-align: right; line-height: 1.1; }
  .led-row-amt .dec { font-size: 11px; color: rgba(14,14,14,0.5); }

  /* ─────────────────────────── SUMMARY (dashboard) ─────────────────────────── */
  .sum-totals { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 2px solid #0e0e0e; }
  .sum-total { padding: 18px 18px 16px; border-right: 2px solid #0e0e0e; }
  .sum-total:last-child { border-right: none; background: #fffaf0; }
  .sum-total.primary { background: #e9c44b; }
  .sum-total .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(14,14,14,0.6); }
  .sum-total .amt { font-family: 'Funnel Display'; font-weight: 800; font-size: 32px; letter-spacing: -0.02em; margin-top: 4px; }
  .sum-total .meta { font-size: 11px; color: rgba(14,14,14,0.6); margin-top: 6px; font-weight: 500; }
  .sum-cat-row { padding: 12px 22px 14px; background: #fffaf0; border-bottom: 1.5px solid rgba(14,14,14,0.07); }
  .sum-cat-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .sum-cat-name { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .sum-cat-amt { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 13px; text-align: right; }
  .sum-cat-amt .sub { display: block; font-size: 11px; color: rgba(14,14,14,0.5); font-weight: 500; }
  .sum-bar { height: 8px; background: #f1ecdf; border: 1.5px solid #0e0e0e; display: flex; }
  .sum-bar-fill { height: 100%; }
  .sum-bar-fill.gbp { background: #0e0e0e; }
  .sum-bar-fill.inr { background: #c0392b; }
  .sum-who-row { padding: 12px 22px; background: #fffaf0; border-bottom: 1.5px solid rgba(14,14,14,0.07); display: flex; gap: 12px; align-items: center; }
  .sum-who-bar-wrap { flex: 1; }
  .sum-who-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .sum-who-name { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

  /* ─────────────────────────── TOMORROW ─────────────────────────── */
  .tom-weather { background: #e9c44b; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0e0e0e; }
  .tom-weather .tmp { font-family: 'Funnel Display'; font-weight: 800; font-size: 22px; }
  .tom-weather .meta { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: rgba(14,14,14,0.7); margin-top: 3px; text-transform: uppercase; }
  .tom-weather .sun { text-align: right; }
  .tom-weather .sun .lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(14,14,14,0.6); }
  .tom-weather .sun .val { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 16px; margin-top: 2px; }

  .tom-event { padding: 14px 22px; background: #fffaf0; border-bottom: 1.5px solid rgba(14,14,14,0.07); display: flex; gap: 14px; align-items: flex-start; }
  .tom-event-time { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 14px; min-width: 44px; padding-top: 2px; }
  .tom-event-body { flex: 1; min-width: 0; }
  .tom-event-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .tom-event-tag {
    display: inline-block; margin-top: 6px;

    padding: 3px 8px; border-radius: 999px;

  }

  .tom-vault-item {
    padding: 14px 22px; background: #fffaf0;

    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .tom-vault-name { font-size: 13px; font-weight: 600; }
  .tom-vault-meta { font-size: 11px; color: rgba(14,14,14,0.5); margin-top: 2px; font-weight: 500; }
  .tom-vault-arrow { width: 28px; height: 28px; border: 2px solid #0e0e0e; border-radius: 4px; display: flex; align-items: center; justify-content: center; }

  /* event add inline */
  .tom-add-bar { padding: 14px 22px; background: #f1ecdf; border-bottom: 1.5px solid rgba(14,14,14,0.1); display: flex; align-items: center; gap: 10px; }
  .tom-add-bar input {
    flex: 1; background: #fffaf0; border: 2px solid #0e0e0e; border-radius: 4px;
    padding: 10px 12px; font-size: 13px; font-weight: 500; outline: none;
  }
  .tom-add-bar button {
    background: #0e0e0e; color: #e9c44b;
    border: 2px solid #0e0e0e; border-radius: 4px;
    padding: 10px 16px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  }

  /* ─────────────────────────── SHEET / MODAL ─────────────────────────── */
  .backdrop {
    position: absolute; inset: 0; background: rgba(14,14,14,0.45);
    z-index: 100;
    animation: fadeIn 0.18s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #fffaf0;
    border-top: 2px solid #0e0e0e;
    z-index: 101;
    animation: slideUp 0.26s cubic-bezier(0.2, 0.7, 0.3, 1);
    padding: 22px;
  }
  .sheet-title { font-family: 'Funnel Display'; font-weight: 800; font-size: 18px; letter-spacing: 0.02em; text-transform: uppercase; margin-bottom: 4px; }
  .sheet-sub { font-size: 11px; color: rgba(14,14,14,0.6); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; margin-bottom: 16px; }
  .sheet-opt {
    padding: 14px;
    border: 2px solid #0e0e0e;
    border-radius: 4px;
    margin-bottom: 10px;
    background: #fffaf0;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
    transition: transform 0.04s, box-shadow 0.04s;
  }
  .sheet-opt:hover { box-shadow: 3px 3px 0 #0e0e0e; }
  .sheet-opt.selected { background: #e9c44b; box-shadow: 3px 3px 0 #0e0e0e; }
  .sheet-opt-label { font-family: 'Funnel Display'; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .sheet-opt-sub { font-size: 11px; color: rgba(14,14,14,0.6); margin-top: 3px; }
  .sheet-opt-mark {
    width: 22px; height: 22px; border: 2px solid #0e0e0e;
    border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #fffaf0;
  }
  .sheet-opt.selected .sheet-opt-mark { background: #0e0e0e; color: #e9c44b; }

  /* settings */
  .settings-row {
    padding: 14px 22px; background: #fffaf0;
    border-bottom: 1.5px solid rgba(14,14,14,0.08);
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }
  .settings-row:active { background: #f1ecdf; }
  .settings-label { font-size: 14px; font-weight: 600; }
  .settings-value { font-size: 13px; color: rgba(14,14,14,0.55); font-weight: 500; }
  .settings-action {
    padding: 16px 22px; background: #fffaf0;
    border-bottom: 1.5px solid rgba(14,14,14,0.08);
    display: flex; align-items: center; gap: 14px;
    cursor: pointer;
    font-size: 14px; font-weight: 700; letter-spacing: 0.04em;
  }
  .settings-action.danger { color: #c0392b; }
  .settings-action:active { background: #f1ecdf; }
  .h-gear {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(233,196,75,0.7);
    margin-left: 8px;
  }
  .h-gear:active { color: #e9c44b; }
  .h-back {
    color: #e9c44b;
    font-family: 'Funnel Display'; font-weight: 700; font-size: 12px;
    letter-spacing: 0.12em; text-transform: uppercase;
    display: flex; align-items: center; gap: 4px;
    margin-bottom: 8px;
  }

  /* wrap screen */
  .wrap-block {
    padding: 18px 22px; background: #fffaf0;
    border-bottom: 2px solid #0e0e0e;
  }
  .wrap-block .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(14,14,14,0.55); margin-bottom: 6px; }
  .wrap-stat-row { display: flex; gap: 10px; justify-content: space-between; }
  .wrap-stat { flex: 1; }
  .wrap-stat .v { font-family: 'Funnel Display'; font-weight: 800; font-size: 24px; letter-spacing: -0.01em; }
  .wrap-stat .k { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(14,14,14,0.55); margin-top: 2px; }
  .wrap-settle-row { padding: 14px 22px; background: #fffaf0; border-bottom: 1.5px solid rgba(14,14,14,0.07); display: flex; align-items: center; gap: 12px; }

  /* wrap screen */
  .wrap-hero {
    background: #e9c44b; padding: 28px 22px; border-bottom: 2px solid #0e0e0e;
    display: flex; flex-direction: column; gap: 6px;
  }
  .wrap-hero-label { font-size: 10px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
  .wrap-hero-amt { font-family: 'Funnel Display'; font-weight: 900; font-size: 56px; letter-spacing: -0.03em; line-height: 1; }
  .wrap-hero-sub { font-size: 13px; font-weight: 600; margin-top: 4px; }

  /* ──────────────── ONBOARDING / TRIP WIZARD ──────────────── */
  .wiz-stage {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: #fffaf0;
    overflow: hidden;
  }
  .wiz-head {
    background: #0e0e0e; color: #fffaf0;
    padding: calc(env(safe-area-inset-top) + 14px) 22px 16px;
    flex-shrink: 0;
  }
  .wiz-head-title {
    font-family: 'Funnel Display'; font-weight: 900;
    font-size: 22px; letter-spacing: -0.01em;
    color: #e9c44b;
  }
  .wiz-head-sub {
    font-size: 11px; font-weight: 500; letter-spacing: 0.08em;
    text-transform: uppercase; color: rgba(255,250,240,0.65);
    margin-top: 6px;
  }
  .wiz-steps {
    display: flex; gap: 6px; margin-top: 12px;
  }
  .wiz-step-dot {
    flex: 1; height: 4px; background: rgba(255,250,240,0.18); border-radius: 2px;
    transition: background 0.18s;
  }
  .wiz-step-dot.done { background: #e9c44b; }
  .wiz-step-dot.active { background: #fffaf0; }

  .wiz-body {
    flex: 1; overflow-y: auto;
    padding: 24px 22px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .wiz-prompt {
    font-family: 'Funnel Display'; font-weight: 800;
    font-size: 22px; line-height: 1.2; letter-spacing: -0.005em;
    margin-bottom: 6px;
  }
  .wiz-help {
    font-size: 13px; color: rgba(14,14,14,0.55);
    line-height: 1.5; margin-bottom: 22px;
  }
  .wiz-label {
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase; color: rgba(14,14,14,0.55);
    margin: 12px 0 6px;
  }
  .wiz-input {
    width: 100%;
    background: #f1ecdf; border: 2px solid #0e0e0e;
    border-radius: 4px; padding: 12px 14px;
    font-size: 16px; font-weight: 500;
    font-family: inherit; outline: none;
    box-shadow: 3px 3px 0 #0e0e0e;
  }
  .wiz-input:focus { background: #fffaf0; }
  .wiz-input-sm {
    background: #f1ecdf; border: 2px solid #0e0e0e;
    border-radius: 4px; padding: 10px 12px;
    font-size: 14px; font-weight: 500;
    font-family: inherit; outline: none;
  }
  .wiz-input-sm:focus { background: #fffaf0; }

  .wiz-member-row, .wiz-card-row {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 8px;
  }
  .wiz-member-row .wiz-input-sm { flex: 1; }
  .wiz-initial {
    width: 44px; height: 44px; flex-shrink: 0;
    background: #0e0e0e; color: #e9c44b;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Funnel Display'; font-weight: 800; font-size: 16px;
    border: 2px solid #0e0e0e; border-radius: 50%;
    box-shadow: 3px 3px 0 #0e0e0e;
  }
  .wiz-remove {
    background: transparent; border: 2px solid #c0392b;
    color: #c0392b; border-radius: 4px;
    width: 36px; height: 36px;
    font-size: 16px; font-weight: 800;
    cursor: pointer; flex-shrink: 0;
  }
  .wiz-remove:active { background: #c0392b; color: #fffaf0; }
  .wiz-add {
    background: transparent; border: 2px dashed #0e0e0e;
    color: #0e0e0e; border-radius: 4px;
    padding: 12px; width: 100%;
    font-size: 12px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    margin-top: 4px;
  }
  .wiz-add:active { background: #f1ecdf; }

  .wiz-card-row .owner-select {
    background: #f1ecdf; border: 2px solid #0e0e0e;
    border-radius: 4px; padding: 10px 8px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase;
    font-family: inherit;
    min-width: 90px;
  }

  .wiz-select-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-bottom: 8px;
  }
  .wiz-radio {
    padding: 12px;
    border: 2px solid #0e0e0e; border-radius: 4px;
    background: #fffaf0;
    text-align: center;
    cursor: pointer;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    transition: transform 0.04s, box-shadow 0.04s;
  }
  .wiz-radio:active { transform: translate(1px, 1px); }
  .wiz-radio.active { background: #e9c44b; box-shadow: 3px 3px 0 #0e0e0e; }
  .wiz-radio .sub {
    display: block;
    font-size: 10px; font-weight: 500; letter-spacing: 0.04em;
    color: rgba(14,14,14,0.55); text-transform: none;
    margin-top: 4px;
  }

  .wiz-date-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  .wiz-foot {
    flex-shrink: 0;
    padding: 14px 22px max(20px, env(safe-area-inset-bottom));
    background: #fffaf0;
    border-top: 2px solid #0e0e0e;
    display: flex; gap: 10px;
  }
  .wiz-btn {
    flex: 1;
    padding: 14px;
    border: 2px solid #0e0e0e; border-radius: 4px;
    font-family: 'Funnel Display'; font-weight: 800; font-size: 14px;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.04s, box-shadow 0.04s;
  }
  .wiz-btn.primary {
    background: #e9c44b; color: #0e0e0e;
    box-shadow: 4px 4px 0 #0e0e0e;
  }
  .wiz-btn.primary:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #0e0e0e; }
  .wiz-btn.primary:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: 4px 4px 0 rgba(14,14,14,0.2); }
  .wiz-btn.ghost { background: transparent; color: #0e0e0e; flex: 0 0 auto; padding: 14px 18px; }
  .wiz-btn.ghost:active { background: #f1ecdf; }

  /* ──────────────── DEMO MODE BANNER (feature 1) ──────────────── */
  .demo-banner {
    position: absolute; top: 0; left: 0; right: 0;
    background: #c0392b; color: #fffaf0;
    padding: max(8px, env(safe-area-inset-top)) 16px 8px;
    z-index: 70;
    font-size: 12px; font-weight: 600; letter-spacing: 0.04em;
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
  }
  .demo-banner .signin {
    background: #fffaf0; color: #0e0e0e;
    border: 2px solid #0e0e0e;
    padding: 6px 12px; border-radius: 4px;
    font-family: 'Funnel Display'; font-weight: 800; font-size: 11px;
    letter-spacing: 0.1em; text-transform: uppercase;
    cursor: pointer;
    flex-shrink: 0;
  }
  .demo-banner .signin:active { transform: translate(1px, 1px); }

  /* When the demo banner is up, push the header down so it doesn't overlap. */
  .phone.with-demo .header { padding-top: 60px; }

  /* ──────────────── SEARCH (feature 4) ──────────────── */
  .led-search {
    padding: 10px 16px;
    background: #f1ecdf;
    border-bottom: 2px solid #0e0e0e;
    display: flex; align-items: center; gap: 8px;
  }
  .led-search input {
    flex: 1;
    background: #fffaf0;
    border: 2px solid #0e0e0e;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    box-shadow: 2px 2px 0 #0e0e0e;
  }
  .led-search-x {
    width: 28px; height: 28px;
    background: transparent;
    border: 2px solid #0e0e0e;
    border-radius: 4px;
    font-size: 16px; font-weight: 800;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .led-search-x:active { background: #f1ecdf; }
  .led-search-toggle {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(233,196,75,0.7);
    background: transparent; border: none;
    cursor: pointer;
  }
  .led-search-toggle:active { color: #e9c44b; }

  /* ──────────────── SYNC DOT (feature 5) ──────────────── */
  .h-sync {
    display: inline-flex; align-items: center; gap: 5px;
    color: rgba(255,250,240,0.55);
    font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    margin-top: 4px;
  }
  .h-sync .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #3ba982;
    box-shadow: 0 0 0 2px rgba(59,169,130,0.25);
    animation: syncPulse 2.4s ease-in-out infinite;
  }
  @keyframes syncPulse {
    0%, 100% { box-shadow: 0 0 0 2px rgba(59,169,130,0.25); }
    50%      { box-shadow: 0 0 0 5px rgba(59,169,130,0.10); }
  }

  /* ──────────────── SETTLEMENT ACTIONS (feature 3) ──────────────── */
  .settle-row-action {
    background: #e9c44b; color: #0e0e0e;
    border: 2px solid #0e0e0e; border-radius: 4px;
    padding: 6px 10px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    box-shadow: 2px 2px 0 #0e0e0e;
    cursor: pointer;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .settle-row-action:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 #0e0e0e; }
  .settle-history-row {
    padding: 10px 22px;
    background: #f1ecdf;
    border-bottom: 1.5px solid rgba(14,14,14,0.07);
    display: flex; align-items: center; gap: 12px;
    opacity: 0.85;
  }
  .settle-history-row .meta {
    font-size: 11px; color: rgba(14,14,14,0.55); margin-top: 2px;
  }

  /* ──────────────── HUB (landing page) ──────────────── */
  .hub-stage {
    width: 100%; height: 100%;
    background: #fffaf0;
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .hub-head {
    background: #0e0e0e; color: #fffaf0;
    padding: calc(env(safe-area-inset-top) + 18px) 22px 20px;
    flex-shrink: 0;
  }
  .hub-brand {
    font-family: 'Funnel Display'; font-weight: 900;
    font-size: clamp(28px, 8vw, 36px);
    letter-spacing: -0.02em; line-height: 1;
    color: #e9c44b;
  }
  .hub-brand-sub {
    margin-top: 8px;
    font-size: 12px; font-weight: 500;
    letter-spacing: 0.04em;
    color: rgba(255,250,240,0.6);
    font-style: italic;
  }
  .hub-body {
    flex: 1; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 20px 22px max(28px, env(safe-area-inset-bottom));
  }
  .hub-greeting {
    font-family: 'Funnel Display'; font-weight: 700;
    font-size: clamp(15px, 4vw, 17px);
    line-height: 1.35;
    color: rgba(14,14,14,0.7);
    margin-bottom: 22px;
  }
  .hub-active {
    background: #e9c44b;
    border: 2px solid #0e0e0e;
    box-shadow: 5px 5px 0 #0e0e0e;
    padding: 18px;
    margin-bottom: 20px;
  }
  .hub-active-tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: rgba(14,14,14,0.6);
    margin-bottom: 6px;
  }
  .hub-active-name {
    font-family: 'Funnel Display'; font-weight: 800;
    font-size: clamp(22px, 6vw, 28px);
    letter-spacing: -0.01em; line-height: 1.1;
    margin-bottom: 6px;
  }
  .hub-active-meta {

    color: rgba(14,14,14,0.75);
    margin-bottom: 16px;
  }
  .hub-active-cta {
    background: #0e0e0e; color: #e9c44b;
    border: 2px solid #0e0e0e; border-radius: 4px;

    font-family: 'Funnel Display'; font-weight: 800; font-size: 14px;
    letter-spacing: 0.12em; text-transform: uppercase;

    margin-bottom: 32px;
  }
  .hub-actions .full { grid-column: 1 / -1; }
  .hub-actionbtn {
    background: #fffaf0; color: #0e0e0e;
    border: 2px solid #0e0e0e; border-radius: 4px;
    padding: 14px 12px;
    font-family: 'Funnel Display'; font-weight: 800; font-size: 13px;
    letter-spacing: 0.08em; text-transform: uppercase;
    box-shadow: 4px 4px 0 #0e0e0e;
    cursor: pointer;
    transition: transform 0.04s, box-shadow 0.04s;

  .hub-actionbtn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #0e0e0e; }
  .hub-newtrip {
    background: #fffaf0; color: #0e0e0e;
    border: 2px solid #0e0e0e; border-radius: 4px;
    padding: 14px;
    font-family: 'Funnel Display'; font-weight: 800; font-size: 14px;
    letter-spacing: 0.1em; text-transform: uppercase;
    width: 100%;
    box-shadow: 4px 4px 0 #0e0e0e;
    cursor: pointer;
  }
  .hub-newtrip:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #0e0e0e; }

  .hub-section {
    font-family: 'Funnel Display'; font-weight: 800;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;

    margin: 0 0 12px;
    display: flex; justify-content: space-between; align-items: baseline;

  .hub-section .ct { font-family: 'IBM Plex Mono'; font-size: 11px; color: rgba(14,14,14,0.4); }
  .hub-trip-card {
    padding: 14px 16px;
    border: 2px solid #0e0e0e; border-radius: 4px;
    background: #fffaf0;
    margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: center;
    gap: 12px;
  }
  .hub-trip-card .nm { font-family: 'Funnel Display'; font-weight: 700; font-size: 14px; }
  .hub-trip-card .dt { font-size: 11px; color: rgba(14,14,14,0.55); margin-top: 3px; }
  .hub-trip-card .badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    color: rgba(14,14,14,0.4);
  }

  .hub-empty {
    padding: 40px 16px;
    text-align: center;
    font-size: 13px;
    color: rgba(14,14,14,0.5);
    line-height: 1.6;

  .hub-empty .big {
    font-family: 'Funnel Display'; font-weight: 800;

    font-size: 16px;

  .hub-signout {
    display: block; width: 100%;

    padding: 24px 8px 0;

    text-transform: uppercase; color: rgba(14,14,14,0.35);
    cursor: pointer;
  }
  .hub-signout:active { color: rgba(14,14,14,0.7); }

  /* Home icon in main header */
  .h-home {

<script type="text/babel" data-presets="react">

const { useState, useMemo, useEffect, useRef } = React;

/* ════════════════════════════════════════════════════════════════════
   PERSISTENCE & NETWORK
   ════════════════════════════════════════════════════════════════════ */

function cleanForStorage(value) {
  // Strip photo data URLs (huge) before persisting; keep a `hasPhoto` flag.
  if (Array.isArray(value)) {
    return value.map((item) => {
      if (item && typeof item === 'object' && 'photo' in item) {
        const { photo, ...rest } = item;
        return { ...rest, hasPhoto: !!photo };
      }
      return item;
    });
  }
  return value;
}

function writeNow(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(cleanForStorage(value)));
    return true;
  } catch (e) {
    console.warn('persist failed', key, e);
    return false;
  }
}

/* IndexedDB for photo data URLs (too large for localStorage) */
const IDB_NAME = 'dadpaid';
const IDB_STORE = 'photos';

function openPhotoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function putPhoto(id, dataUrl) {

    await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(dataUrl, id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  } catch (e) { console.warn('putPhoto failed', e); }
}

function usePhoto(id, hasPhoto) {
  const [src, setSrc] = useState(null);
  useEffect(() => {
    if (!id || !hasPhoto) { setSrc(null); return; }
    let alive = true;
    getPhoto(id).then((url) => { if (alive) setSrc(url); });
    return () => { alive = false; };
  }, [id, hasPhoto]);
  return src;
}

function usePersistedState(key, initial) {
  const [state, setStateRaw] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      if (raw == null) return initial;
      return JSON.parse(raw);
    } catch { return initial; }
  });

  // Wrap setState so EVERY mutation writes to localStorage synchronously,
  // before React schedules the re-render. This means a refresh immediately
  // after an action will always see the latest data.
  const setState = (next) => {
    setStateRaw((prev) => {
      const resolved = typeof next === 'function' ? next(prev) : next;
      writeNow(key, resolved);
      return resolved;
    });
  };

  // Also persist once on mount in case seed data was just hydrated.
  useEffect(() => {
    writeNow(key, state);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return [state, setState];
}

function useOnline() {
  const [online, setOnline] = useState(typeof navigator !== 'undefined' ? navigator.onLine : true);
  useEffect(() => {
    const up = () => setOnline(true);
    const down = () => setOnline(false);
    window.addEventListener('online', up);
    window.addEventListener('offline', down);
    return () => {
      window.removeEventListener('online', up);
      window.removeEventListener('offline', down);
    };
  }, []);
  return online;
}

/* Loader: pulls family/members/cards/active trip/expenses/events/vault. */
async function loadAll() {
  // 1. The user's own family (the one they own). May be null for pure-guest users.
  const { data: fams } = await sb.from('families').select('*').limit(1);
  const userFamily = fams?.[0] || null;

  // 2. All trips visible to me. RLS includes both owned families and trips I'm a participant in.
  const { data: allTrips } = await sb.from('trips').select('*').order('start_date', { ascending: false });
  const trips = allTrips || [];

  // 3. Active trip: prefer my own active, else any active I can see (only one expected at a time).
  let active = trips.find((t) => t.status === 'active' && userFamily && t.family_id === userFamily.id) || null;
  if (!active) active = trips.find((t) => t.status === 'active') || null;

  if (!active) {
    return {
      family: userFamily, userFamily,
      members: [], cards: [],
      trip: null, pastTrips: trips.filter((t) => t.status === 'ended'),
      expenses: [], events: [], vault: [],
      participants: [],
    };
  }

  // 4. The family that OWNS the active trip (may not be `userFamily` for guest joins).
  const { data: tfams } = await sb.from('families').select('*').eq('id', active.family_id).limit(1);
  const tripFamily = tfams?.[0] || userFamily;

  // 5. Members + cards for the trip family.
  const [{ data: members }, { data: cards }, { data: exps }, { data: evs }, { data: vlt }, { data: parts }, { data: sets }] = await Promise.all([
    sb.from('family_members').select('*').eq('family_id', active.family_id).order('position'),
    sb.from('family_cards').select('*').eq('family_id', active.family_id).order('position'),
    sb.from('expenses').select('*').eq('trip_id', active.id).order('date', { ascending: false }),
    sb.from('events').select('*').eq('trip_id', active.id).order('time'),
    sb.from('vault_items').select('*').eq('trip_id', active.id),
    sb.from('trip_participants').select('user_id, member_id, role').eq('trip_id', active.id),
    sb.from('settlements').select('*').eq('trip_id', active.id).order('settled_at', { ascending: false }),
  ]);

  return {
    family: tripFamily, userFamily,
    members: members || [], cards: cards || [],
    trip: active, pastTrips: trips.filter((t) => t.status === 'ended'),
    expenses: exps || [], events: evs || [], vault: vlt || [],
    participants: parts || [],
    settlements: sets || [],
  };
}

/* On boot: capture invite codes from URL into localStorage, then clean the URL.
   Acceptance happens after auth + onboarding (see App.useEffect). */
(function captureInviteCode() {
  try {
    const params = new URLSearchParams(window.location.search);
    const code = params.get('invite');
    if (code) {
      localStorage.setItem('dp.pending_invite', code);
      params.delete('invite');
      const newSearch = params.toString();
      const newUrl = window.location.pathname + (newSearch ? '?' + newSearch : '') + window.location.hash;
      window.history.replaceState({}, '', newUrl);
    }
  } catch (e) { /* ignore */ }
})();

async function acceptPendingInvite() {
  const code = localStorage.getItem('dp.pending_invite');
  if (!code) return null;
  try {
    const { data, error } = await sb.rpc('accept_invite', { p_code: code });
    localStorage.removeItem('dp.pending_invite');
    if (error) return { error: error.message };
    return data || null;
  } catch (e) {
    localStorage.removeItem('dp.pending_invite');
    return { error: String(e?.message || e) };
  }
}

  }

/* Photo upload: data-URL → blob → storage. Returns storage path. */
async function uploadPhotoFromDataUrl(dataUrl, familyId, expenseId) {
  try {
    const m = dataUrl.match(/^data:(image\/[^;]+);base64,(.+)$/);
    if (!m) return null;
    const mime = m[1]; const ext = mime.split('/')[1] || 'jpg';
    const bytes = Uint8Array.from(atob(m[2]), (c) => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: mime });
    const path = `${familyId}/${expenseId}.${ext}`;
    const { error } = await sb.storage.from('photos').upload(path, blob, { upsert: true, contentType: mime });
    if (error) { console.warn('photo upload failed', error); return null; }
    return path;
  } catch (e) { console.warn('photo upload threw', e); return null; }
}

async function fetchPhotoFromStorage(path) {
  if (!path) return null;
  const { data, error } = await sb.storage.from('photos').createSignedUrl(path, 3600);
  if (error || !data?.signedUrl) return null;
  return data.signedUrl;
}

/* Platform detection for "Add to Home Screen" guidance. */
function detectPlatform() {
  if (typeof window === 'undefined') return 'unknown';
  const isStandalone =
    window.matchMedia?.('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;
  if (isStandalone) return 'installed';
  const ua = navigator.userAgent || '';
  if (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
  if (/Android/.test(ua)) return 'android';
  return 'desktop';
}

let deferredInstallPrompt = null;
if (typeof window !== 'undefined') {
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
  });
}

function LoginScreen() {
  const [mode, setMode] = useState('signup');  // 'signup' | 'login'
  const [email, setEmail] = useState('');
  const [sent, setSent] = useState(false);
  const [busy, setBusy] = useState(false);
  const [googleBusy, setGoogleBusy] = useState(false);
  const [err, setErr] = useState(null);

  async function submit(e) {
    if (e) e.preventDefault();
    if (!email.trim()) return;
    setBusy(true); setErr(null);
    try {
      const { error } = await sb.auth.signInWithOtp({
        email: email.trim(),
        options: {
          // signup creates the user if they don't exist; login refuses.
          shouldCreateUser: mode === 'signup',
          emailRedirectTo: window.location.origin + window.location.pathname,
        },
      });
      if (error) {
        const msg = error.message.toLowerCase();
        if (mode === 'login' && (msg.includes('not found') || msg.includes('signups not allowed for otp') || msg.includes('signup is disabled'))) {
          setErr("No account with that email. Tap SIGN UP to create one.");
        } else {
          setErr(error.message);
        }
      } else {
        setSent(true);
      }
    } catch (e) { setErr(String(e?.message || e)); }
    setBusy(false);
  }

  async function googleSignIn() {
    setGoogleBusy(true); setErr(null);
    try {
      const { error } = await sb.auth.signInWithOAuth({
        provider: 'google',
        options: {
          redirectTo: window.location.origin + window.location.pathname,
          queryParams: { access_type: 'offline', prompt: 'consent' },
        },
      });
      if (error) { setErr(error.message); setGoogleBusy(false); }
      // On success, the browser redirects to Google; no further state to update.
    } catch (e) {
      setErr(String(e?.message || e));
      setGoogleBusy(false);
    }
  }

  return (
    <div className="login-stage">
      <div className="login-card">
        <div className="login-brand">
          <div className="login-title">DAD PAID</div>
          <div className="login-tagline">Because on every trip, dad paid.</div>
          <div className="login-tagline" style={{marginTop: 4, color: 'rgba(14,14,14,0.4)', fontSize: 10}}>
            (and someone had to log it)
          </div>
        </div>
        {sent ? (
          <div className="login-sent">
            <div className="login-sent-line">CHECK YOUR EMAIL</div>
            <div className="login-sent-meta">We sent a magic link to<br /><strong>{email}</strong></div>
            <button className="login-back" onClick={() => setSent(false)}>USE A DIFFERENT EMAIL</button>
          </div>
        ) : (
          <form className="login-form" onSubmit={submit}>
            <div className="login-tabs">
              <button type="button" className={`login-tab ${mode === 'signup' ? 'active' : ''}`} onClick={() => { setMode('signup'); setErr(null); }}>
                SIGN UP
              </button>
              <button type="button" className={`login-tab ${mode === 'login' ? 'active' : ''}`} onClick={() => { setMode('login'); setErr(null); }}>
                LOG IN
              </button>
            </div>

            <button type="button" className="login-google" onClick={googleSignIn} disabled={googleBusy || busy}>
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.99.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
              </svg>
              <span>{googleBusy ? 'OPENING…' : (mode === 'signup' ? 'SIGN UP WITH GOOGLE' : 'LOG IN WITH GOOGLE')}</span>
            </button>

            <div className="login-divider">or</div>

            <label className="login-label">EMAIL</label>
            <input
              type="email"
              className="login-input"
              value={email}
              onChange={(e) => setEmail(e.target.value)}
              placeholder="you@example.com"
            />
            {err && <div className="login-err">{err}</div>}
            <button type="submit" className="login-cta" disabled={busy || !email.trim()}>
              {busy
                ? 'SENDING…'
                : mode === 'signup'
                  ? 'CREATE ACCOUNT ›'
                  : 'SEND LOGIN LINK ›'}
            </button>
            <div className="login-help">
              {mode === 'signup'
                ? "New here. We'll mail you a one-tap link to finish signing up. No password."
                : "Welcome back. We'll mail you a one-tap login link. No password to remember."}
            </div>
          </form>
        )}

        {!sent && (
          <>
            <div className="login-jokes">
              <div className="qa">
                <div className="q">Is this Splitwise?</div>
                <div>No. Splitwise is for roommates arguing over rent. Dad Paid is for trips.</div>

              </div>
              <div className="qa">

                <div>No. We're not big enough to be evil yet.</div>
              </div>
            </div>

            <div className="login-foot">
              <a href="about.html">About &amp; Privacy</a>
              <span className="sep">·</span>
              <span>v0.2</span>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

function KeypadScreen({ expenses, todayDate, online, syncLive, onAdd, onToast, onGear, onHome }) {

  const [currency, setCurrency] = useState(tripCurrency);

  // Default payer and card from the actual family, not hardcoded slugs.
  const defaultPayer = FAMILY.members[0]?.id || '';
  const defaultCard = cardsOf(defaultPayer)[0]?.id || '';
  const [payer, setPayer] = useState(defaultPayer);
  const [card, setCard] = useState(defaultCard);
  const [split, setSplit] = useState(TRIP.defaultSplit || 'everyone');
  const [splitOpen, setSplitOpen] = useState(false);
  const [photo, setPhoto] = useState(null); // dataURL string

  // If family loads after this screen mounts, snap into a real payer/card.
  useEffect(() => {
    if (!payer && FAMILY.members[0]) setPayer(FAMILY.members[0].id);
  }, [FAMILY.members.length]);

  // payer change → pick first card for that payer
  useEffect(() => {
    const cards = cardsOf(payer);
    if (!cards.find(c => c.id === card)) setCard(cards[0]?.id || '');
  }, [payer]);

  const cardObj = cardOf(card);
  const minorAmount = Math.round(parseFloat(amount || '0') * 100);
  const isZero = minorAmount === 0;
  const todayTotal = totalFor(expenses, { date: todayDate, currency: tripCurrency });

  // parse display parts
  const [majorStr, decStr] = amount.split('.');
  const hasDot = amount.includes('.');
  const majorDisplay = amount ? fmtMajor(parseInt(majorStr || '0', 10) * 100, currency) : '0';

  function press(d) {
    // cap raw length
    if (amount.length >= 12) return;
    // cap decimal places to 2
    if (hasDot) {
      const dec = amount.split('.')[1] || '';
      if (dec.length >= 2) return;
    }
    // block leading zeros like "00" but allow "0." and "0.5"
    if (amount === '0' && d !== '0') {
      setAmount(d);
      return;
    }
    if (!amount && d === '0') {
      setAmount('0');
      return;
    }
    setAmount(amount + d);
  }
  function decimal() {
    if (hasDot) return;
    setAmount((amount || '0') + '.');
  }
  function del() {
    setAmount(amount.slice(0, -1));
  }
  function clear() { setAmount(''); }

  function openCamera() {
    fileRef.current?.click();
  }
  function onPhotoPicked(ev) {
    const file = ev.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      setPhoto(reader.result);
      onToast('📎 Photo attached');
    };
    reader.readAsDataURL(file);
    ev.target.value = ''; // allow re-pick of same file
  }
  function clearPhoto() { setPhoto(null); }

  function submit() {
    if (isZero) return;
    if (!payer) { onToast('Pick a payer first'); return; }
    const now = Date.now();
    const e = {
      id: 'e' + now,
      ts: now, // for sort order
      date: todayDate,
      payer, card,
      amount: minorAmount,
      currency,
      title: category,
      category,
      split,
      photo,
    };
    onAdd(e);
    const m = memberOf(payer);
    onToast(`+ ${fmtFull(minorAmount, currency)} · ${m?.name || 'unknown'}`);
    setAmount('');
    setPhoto(null);
  }

  return (
    <>
      <Header
        title="DAD PAID"
        sub={`${TRIP.shortName} · ${fmtFull(todayTotal, tripCurrency)} so far today`}
        right={`D ${TRIP.currentDay} / ${TRIP.totalDays}`}
        onGear={onGear}
        onHome={onHome}
        offline={!online}
        syncLive={syncLive}
      />

      <div className="kp-body">
        {/* AMOUNT */}
        <div className="kp-top">
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap: 10}}>
            <div className={`kp-amount ${isZero ? 'zero' : ''}`}>
              <button
                className="kp-sym-btn sym"
                onClick={() => setCurrency(currency === 'GBP' ? 'INR' : 'GBP')}
                aria-label="toggle currency"
              >{symbol(currency)}</button>
              {amount === '' ? (
                <span>0</span>
              ) : (
                <span>{majorDisplay}{hasDot && '.'}{decStr || ''}</span>
              )}
            </div>
            {!isZero && <button className="kp-clear" onClick={clear} style={{flexShrink:0}}>CLEAR ✕</button>}
          </div>

          {/* category horizontal scroll */}
          <div className="kp-cats">
            {CATEGORIES.map(c => (
              <button
                key={c}
                className={`kp-cat ${category === c ? 'active' : ''}`}
                onClick={() => setCategory(c)}
              >
                {c.toUpperCase()}
              </button>
            ))}
          </div>

          {/* split + photo */}
          <div style={{display:'flex', gap: 8, marginTop: 8}}>
            <button
              className="chip chip-active"
              onClick={() => setSplitOpen(true)}
              style={{flex: 1, justifyContent:'space-between'}}
            >
              <span>SPLIT · {SPLIT_OPTIONS.find(o => o.id === split).label}</span>
              <span>▾</span>
            </button>
            <button
              className={`chip ${photo ? 'chip-active' : ''}`}
              onClick={openCamera}
              aria-label="attach photo"
              style={{flexShrink:0, padding: '6px 12px'}}
            >
              {photo ? '📎 PHOTO' : '+ 📎'}
            </button>
          </div>
        </div>

        {/* PAYERS */}
        <div className="kp-payers">
          {FAMILY.members.map(m => (
            <button key={m.id} className={`kp-payer ${payer === m.id ? 'active' : ''}`} onClick={() => setPayer(m.id)}>
              <Avatar id={m.id} size="lg" selected={payer === m.id} />
              <div className="kp-payer-name">{m.name}</div>
            </button>
          ))}
        </div>

        {/* CARD BAR */}
        <div className="kp-card-bar">
          <span>■ {cardObj ? `${cardObj.nick.toUpperCase()}${cardObj.last4 ? ' · ' + cardObj.last4 : ''}` : 'NO CARD'}</span>
          <button className="swap" onClick={() => {
            const cards = cardsOf(payer);
            const idx = cards.findIndex(c => c.id === card);
            setCard(cards[(idx + 1) % cards.length].id);
          }}>SWAP ›</button>
        </div>

        {/* KEYPAD */}
        <div className="kp-pad">
          {[1,2,3,4,5,6,7,8,9].map(n => (
            <button key={n} className="key" onClick={() => press(String(n))}>{n}</button>
          ))}
          <button className="key" onClick={decimal} aria-label="decimal point">.</button>
          <button className="key" onClick={() => press('0')}>0</button>
          <button className="key" onClick={del}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
              <line x1="18" y1="9" x2="12" y2="15"/>
              <line x1="12" y1="9" x2="18" y2="15"/>
            </svg>
          </button>
          <input
            ref={fileRef}
            type="file"
            accept="image/*"
            capture="environment"
            onChange={onPhotoPicked}
            style={{display:'none'}}
          />
          <button className={`cta kp-cta ${isZero ? 'cta-disabled' : ''}`} onClick={submit}>
            ADD →
          </button>
        </div>
      </div>

      {/* SPLIT SHEET */}
      {splitOpen && (
        <>
          <div className="backdrop" onClick={() => setSplitOpen(false)} />
          <div className="sheet">
            <div className="sheet-title">SPLIT</div>
            <div className="sheet-sub">Who's this expense for?</div>
            {SPLIT_OPTIONS.map(o => (
              <div key={o.id} className={`sheet-opt ${split === o.id ? 'selected' : ''}`} onClick={() => { setSplit(o.id); setTimeout(() => setSplitOpen(false), 120); }}>
                <div>
                  <div className="sheet-opt-label">{o.label}</div>
                  <div className="sheet-opt-sub">{o.sub}</div>
                </div>
                <div className="sheet-opt-mark">{split === o.id ? '✓' : ''}</div>
              </div>
            ))}
          </div>
        </>
      )}

    </>
  );
}

/* ════════════════════════════════════════════════════════════════════
   LEDGER (Timeline)
   ════════════════════════════════════════════════════════════════════ */

function LedgerScreen({ expenses, todayDate, online, syncLive, onGear, onHome, onOpenPhoto, onOpenEdit, myMemberId }) {
  const [filter, setFilter] = useState('all'); // all | mine | <currency>
  const [searchOpen, setSearchOpen] = useState(false);
  const [query, setQuery] = useState('');
  const tripCurrency = (TRIP.currencies && TRIP.currencies[0]) || 'GBP';
  const presentCurrencies = useMemo(() => distinctCurrencies(expenses), [expenses]);

  const filtered = useMemo(() => {
    let base = expenses.filter(e => {
      if (filter === 'mine') return e.payer === myMemberId;
      if (filter !== 'all') return e.currency === filter;
      return true;
    });
    if (query.trim()) {
      const nameById = Object.fromEntries(FAMILY.members.map((m) => [m.id, m.name]));
      base = filterExpenses(base, query, nameById);
    }
    return base;
  }, [expenses, filter, myMemberId, query]);

  const preTrip = filtered.filter(e => e.preTrip);
  const inTrip  = filtered.filter(e => !e.preTrip);

  // group in-trip by date, descending; within day, newest first
  const byDate = useMemo(() => {
    const map = {};
    for (const e of inTrip) {
      map[e.date] = map[e.date] || [];
      map[e.date].push(e);
    }
    const dates = Object.keys(map).sort((a, b) => b.localeCompare(a));
    return dates.map(d => ({
      date: d,
      items: map[d].sort((a, b) => (b.ts || 0) - (a.ts || 0) || b.id.localeCompare(a.id))
    }));
  }, [inTrip]);

  // Display the trip's primary currency total; show parenthetical other-currency
  // totals when the trip has mixed currencies.
  function bandTotal(rows) {
    const cur = filter !== 'all' && filter !== 'mine' ? filter : tripCurrency;
    return fmtFull(totalFor(rows, { currency: cur }), cur, { compact: true });
  }

  return (
    <>
      <Header
        title="THE LEDGER"
        sub={`${TRIP.shortName} · DAY ${TRIP.currentDay} OF ${TRIP.totalDays}`}
        right={`${expenses.length}`}
        rightSub="ENTRIES"
        onGear={onGear}
        onHome={onHome}
        offline={!online}
        extraLeft={
          <button
            className="led-search-toggle"
            onClick={() => setSearchOpen(!searchOpen)}
            aria-label="search"
            style={{marginRight: 4}}
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
          </button>
        }
      />
      {searchOpen && (
        <div className="led-search">
          <input
            autoFocus
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="search expenses, payer, amount, category"
          />
          <button
            className="led-search-x"
            onClick={() => { setQuery(''); setSearchOpen(false); }}
            aria-label="close search"
          >×</button>
        </div>
      )}

      <div className="body">
        <div className="led-filters">
          <button className={`led-filter ${filter === 'all'  ? 'active' : ''}`} onClick={() => setFilter('all')}>ALL</button>
          <button className={`led-filter ${filter === 'mine' ? 'active' : ''}`} onClick={() => setFilter('mine')}>MINE</button>
          {presentCurrencies.slice(0, 2).map((c) => (
            <button
              key={c}
              className={`led-filter ${filter === c ? 'active' : ''}`}
              onClick={() => setFilter(c)}
            >{symbol(c)} {c}</button>
          ))}
        </div>

        {expenses.length === 0 && (
          <EmptyState
            glyph="🍴"
            line="First expense will land here."
            sub="Probably coffee. Tap ADD to log one. It'll show up under TODAY with a fresh-mustard flash."
          />
        )}

        {/* Pre-trip */}
        {preTrip.length > 0 && (
          <>
            <div className="led-day-band dim">
              <div>
                <div className="lbl">BEFORE TRIP</div>
                <div className="sub">Hotels · flights · advance</div>
              </div>
              <div className="total">{bandTotal(preTrip)}</div>
            </div>
            {preTrip.map(e => <LedgerRow key={e.id} e={e} onOpenPhoto={onOpenPhoto} onOpenEdit={onOpenEdit} />)}
          </>
        )}

        {/* By day */}
        {byDate.map(({ date, items }) => {
          return (
            <div key={date}>
              <div className={`led-day-band ${date !== todayDate ? 'dim' : ''}`}>
                <div>
                  <div className="lbl">{dayLabel(date, todayDate)}</div>
                  <div className="sub">{date}</div>
                </div>
                <div className="total">{bandTotal(items)}</div>
              </div>
              {items.map(e => <LedgerRow key={e.id} e={e} onOpenPhoto={onOpenPhoto} onOpenEdit={onOpenEdit} />)}
            </div>
          );
        })}

        <div style={{padding: '24px 22px', textAlign:'center', fontSize:11, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:'rgba(14,14,14,0.45)'}}>
          end of ledger · trip total {bandTotal(filtered)}
        </div>
      </div>
    </>
  );
}

function LedgerRow({ e, onOpenPhoto, onOpenEdit }) {
  const m = memberOf(e.payer);
  const fresh = e.ts && (Date.now() - e.ts < 2000);
  const unsynced = e.synced === false;
  const hasPhoto = e.hasPhoto || e.photo;
  const memberName = (m?.name || 'Unknown').toUpperCase();
  const categoryLabel = (e.category || 'Other').toUpperCase();
  const cardLast4 = cardOf(e.card)?.last4;
  return (
    <div
      className={`led-row ${fresh ? 'fresh' : ''} ${unsynced ? 'led-row-unsynced' : ''}`}
      onClick={() => onOpenEdit && onOpenEdit(e)}
    >
      <Avatar id={e.payer} />
      <div style={{flex: 1, minWidth: 0}}>
        <div className="led-row-title">
          {e.title || categoryLabel}
          {hasPhoto && (
            <button
              className="led-photo-badge"
              onClick={(ev) => { ev.stopPropagation(); onOpenPhoto(e); }}
            >📎</button>
          )}
        </div>
        <div className="led-row-sub">
          {memberName} · {categoryLabel}{cardLast4 ? ' · ' + cardLast4 : ''}
          {unsynced && <span style={{marginLeft:6, color:'#c0392b', fontWeight:700, letterSpacing:'0.08em'}}>· OFFLINE</span>}
        </div>
      </div>
      <div className="led-row-amt">
        {symbol(e.currency)}{fmtMajor(e.amount, e.currency)}<span className="dec">.{fmtMinor(e.amount)}</span>
      </div>
    </div>
  );
}

function PhotoLightbox({ expense, onClose }) {
  const localSrc = usePhoto(expense?.id, !!(expense && (expense.hasPhoto || expense.photo)));
  const [remoteSrc, setRemoteSrc] = useState(null);
  useEffect(() => {
    setRemoteSrc(null);
    if (localSrc) return;
    if (expense?.photoPath) {
      fetchPhotoFromStorage(expense.photoPath).then(setRemoteSrc);
    }
  }, [expense?.id, expense?.photoPath, localSrc]);
  if (!expense) return null;
  const src = localSrc || remoteSrc;
  return (
    <div className="lightbox" onClick={onClose}>
      <div className="lightbox-img-wrap">
        {src ? (
          <img src={src} alt="receipt" onClick={(e) => e.stopPropagation()} />
        ) : (
          <div style={{color:'#e9c44b', fontSize:12, letterSpacing:'0.12em', fontWeight:700, textTransform:'uppercase'}}>
            {expense.photoPath ? 'Loading from cloud…' : 'Photo not stored on this device'}
          </div>
        )}
      </div>
      <div className="lightbox-footer" onClick={(e) => e.stopPropagation()}>
        <div className="lightbox-meta">{expense.title} · {symbol(expense.currency)}{fmtMajor(expense.amount, expense.currency)}.{fmtMinor(expense.amount)}</div>
        <button className="lightbox-close" onClick={onClose}>CLOSE</button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════
   SUMMARY (Dashboard)
   ════════════════════════════════════════════════════════════════════ */

function SummaryScreen({ expenses, settlements, todayDate, online, syncLive, onGear, onHome, onMarkSettled, onUndoSettlement }) {
  const presentCurrencies = useMemo(() => {
    const set = distinctCurrencies(expenses);
    if (set.length === 0 && TRIP.currencies?.[0]) set.push(TRIP.currencies[0]);
    return set;
  }, [expenses]);

  const totalsByCurrency = useMemo(() => {
    return presentCurrencies.map((c) => ({ currency: c, total: totalFor(expenses, { currency: c }) }));
  }, [expenses, presentCurrencies]);

  // by category — keyed map[cat][currency] = amount (any currency, not just GBP/INR)
  const byCat = useMemo(() => {
    const map = {};
    for (const e of expenses) {
      const cat = e.category || 'Other';
      if (!map[cat]) map[cat] = {};
      const cur = e.currency || 'GBP';
      map[cat][cur] = (map[cat][cur] || 0) + e.amount;
    }
    return Object.entries(map)
      .map(([cat, v]) => ({ cat, byCur: v, total: Object.values(v).reduce((s, n) => s + n, 0) }))
      .sort((a, b) => b.total - a.total);
  }, [expenses]);

  const byPerson = useMemo(() => {
    return FAMILY.members.map(m => {
      const byCur = {};
      for (const c of presentCurrencies) byCur[c] = totalFor(expenses, { payer: m.id, currency: c });
      const total = Object.values(byCur).reduce((s, n) => s + n, 0);
      return { id: m.id, name: m.name, byCur, total };
    }).sort((a, b) => b.total - a.total);
  }, [expenses, presentCurrencies]);

  const maxCat = Math.max(...byCat.map(c => c.total), 1);
  const maxPerson = Math.max(...byPerson.map(p => p.total), 1);

  const CAT_ICONS = { Food:'🍴', Travel:'🚂', Hotel:'🛏', Shopping:'🛍', Activity:'🎟', Tickets:'🎫', Groceries:'🧺', Other:'•' };

  const subDates = TRIP.startDate && TRIP.endDate
    ? `${formatDateShort(TRIP.startDate)} to ${formatDateShort(TRIP.endDate)}`.toUpperCase()
    : '';

  return (
    <>
      <Header
        title="SUMMARY"
        sub={`${TRIP.shortName}${subDates ? ' · ' + subDates : ''}`}
        right={`D ${TRIP.currentDay}`}
        rightSub={`/ ${TRIP.totalDays}`}
        onGear={onGear}
        onHome={onHome}
        offline={!online}
        syncLive={syncLive}
      />

      <div className="body">
        {expenses.length === 0 ? (
          <EmptyState
            glyph="📊"
            line="Numbers appear once money does."
            sub="Log a few expenses, then come back here. Totals, category bars, who-paid-most, and a live settlement preview will fill in."
          />
        ) : (
        <>
        {/* TOTALS — one tile per currency present in the trip */}
        <div className="sum-totals" style={{gridTemplateColumns: `repeat(${Math.max(1, totalsByCurrency.length)}, 1fr)`}}>
          {totalsByCurrency.map((t, i) => (
            <div key={t.currency} className={`sum-total ${i === 0 ? 'primary' : ''}`}>
              <div className="lbl">{t.currency} SPEND</div>
              <div className="amt">{symbol(t.currency)}{fmtMajor(t.total, t.currency)}</div>
              <div className="meta">{t.total === 0 ? '·' : `${expenses.filter((e) => e.currency === t.currency).length} entries`}</div>
            </div>
          ))}
        </div>

        {/* BY CATEGORY */}
        <div className="section-band-dark">
          <span>BY CATEGORY</span>
          <span>SORTED</span>
        </div>
        {byCat.map(c => {
          const curs = Object.keys(c.byCur);
          return (
            <div key={c.cat} className="sum-cat-row">
              <div className="sum-cat-head">
                <div className="sum-cat-name">{CAT_ICONS[c.cat] || '•'} {c.cat}</div>
                <div className="sum-cat-amt">
                  {curs.map((cur, ix) => (
                    <span key={cur}>
                      {ix > 0 && ' + '}
                      {symbol(cur)}{fmtMajor(c.byCur[cur], cur)}
                    </span>
                  ))}
                </div>
              </div>
              <div className="sum-bar">
                <div className="sum-bar-fill gbp" style={{width: (c.total / maxCat * 100) + '%'}} />
              </div>
            </div>
          );
        })}

        {/* WHO PAID */}
        <div className="section-band-dark">
          <span>WHO PAID</span>
          <span>BY PERSON</span>
        </div>
        {byPerson.map(p => {
          const curs = Object.keys(p.byCur).filter((c) => p.byCur[c] > 0);
          return (
            <div key={p.id} className="sum-who-row">
              <Avatar id={p.id} />
              <div className="sum-who-bar-wrap">
                <div className="sum-who-head">
                  <div className="sum-who-name">{p.name}</div>
                  <div className="sum-cat-amt">
                    {curs.length === 0 && <span style={{color: 'rgba(14,14,14,0.4)'}}>—</span>}
                    {curs.map((cur, ix) => (
                      <span key={cur}>
                        {ix > 0 && ' · '}
                        {symbol(cur)}{fmtMajor(p.byCur[cur], cur)}
                      </span>
                    ))}
                  </div>
                </div>
                <div className="sum-bar">
                  <div className="sum-bar-fill gbp" style={{width: (p.total / maxPerson * 100) + '%'}} />
                </div>
              </div>
            </div>
          );
        })}

        {/* SETTLEMENT PEEK */}
        <div className="section-band-dark">
          <span>SETTLEMENT</span>
          <span>{settlements?.length ? 'WITH HISTORY' : 'AT TRIP END'}</span>
        </div>
        <Settlement
          expenses={expenses}
          settlements={settlements}
          onMarkSettled={onMarkSettled}
          onUndoSettlement={onUndoSettlement}
        />

        <div style={{padding: '24px 22px', textAlign:'center', fontSize:11, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:'rgba(14,14,14,0.45)'}}>
          settlement locks when trip ends
        </div>
        </>
        )}
      </div>
    </>
  );
}

function MarkSettledModal({ transfer, onConfirm, onClose }) {
  const [method, setMethod] = useState('Cash');
  const [note, setNote] = useState('');
  const [busy, setBusy] = useState(false);
  if (!transfer) return null;
  const methods = ['Cash', 'UPI', 'Bank', 'Venmo', 'Other'];

  async function confirm() {
    setBusy(true);
    try { await onConfirm({ ...transfer, method, note: note.trim() || null }); }
    finally { setBusy(false); }
  }

  return (
    <>
      <div className="backdrop" onClick={onClose} />
      <div className="invite-modal">
        <div className="invite-title">MARK SETTLED</div>
        <div className="invite-sub">
          <strong>{memberOf(transfer.from)?.name || 'Someone'}</strong> paid <strong>{memberOf(transfer.to)?.name || 'Someone'}</strong>{' '}
          {symbol(transfer.currency)}{fmtMajor(transfer.amount, transfer.currency)}.{fmtMinor(transfer.amount)}
        </div>

        <div className="wiz-label">How?</div>
        <div className="wiz-select-row" style={{gridTemplateColumns: 'repeat(3, 1fr)'}}>
          {methods.map((m) => (
            <div key={m} className={`wiz-radio ${method === m ? 'active' : ''}`} onClick={() => setMethod(m)}>{m}</div>
          ))}
        </div>

        <div className="wiz-label">Note (optional)</div>
        <input
          className="wiz-input"
          value={note}
          onChange={(e) => setNote(e.target.value)}
          placeholder="e.g. paid at dinner"
          style={{boxShadow: '3px 3px 0 #0e0e0e'}}
        />

        <div className="invite-btn-row" style={{marginTop: 16}}>
          <button className="invite-btn ghost" onClick={onClose}>CANCEL</button>
          <button className="invite-btn primary" onClick={confirm} disabled={busy}>
            {busy ? 'SAVING…' : 'CONFIRM ›'}
          </button>
        </div>
      </div>
    </>
  );
}

function Settlement({ expenses, settlements, onMarkSettled, onUndoSettlement, readonly }) {
  // settleTrip respects priorSettlements: gross debts minus already-paid offsets.
  const all = settleTrip(expenses, FAMILY.members, {
    priorSettlements: (settlements || []).map((s) => ({
      from: s.from_member_id, to: s.to_member_id, amount: s.amount, currency: s.currency,
    })),
  });

  return (
    <>
      {all.length === 0 ? (
        <div className="row" style={{justifyContent:'center', color:'rgba(14,14,14,0.5)', fontSize:13, fontWeight:600, fontStyle:'italic'}}>
          {settlements?.length ? 'All settled. Nice.' : "Everyone's even. Suspicious."}
        </div>
      ) : (
        all.map((t, idx) => (
          <div key={idx} className="row">
            <Avatar id={t.from} />
            <div style={{flex: 1, fontSize: 13, fontWeight: 600, minWidth: 0}}>
