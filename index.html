function TripWrapScreen({ expenses, settlements, onBack, onToast }) {
  const tripCurrency = (TRIP.currencies && TRIP.currencies[0]) || 'GBP';
  const total = totalFor(expenses, { currency: tripCurrency });
  const inTrip = expenses.filter(e => !e.preTrip);
  const preTrip = expenses.filter(e => e.preTrip);
  const days = TRIP.totalDays || 1;
  const avgPerDay = inTrip.length ? Math.round(totalFor(inTrip, { currency: tripCurrency }) / days) : 0;

  // top category — count across all currencies (assumes parity for "popular")
  const catTotals = {};
  for (const e of expenses) {
    const cat = e.category || 'Other';
    catTotals[cat] = (catTotals[cat] || 0) + e.amount;
  }
  const topCat = Object.entries(catTotals).sort((a, b) => b[1] - a[1])[0];

  // biggest spender — by trip's primary currency
  const personTotals = FAMILY.members.map(m => ({
    id: m.id, name: m.name,
    initial: m.initial || initialFor(m.name),
    paid: totalFor(expenses, { payer: m.id, currency: tripCurrency }),
  })).sort((a, b) => b.paid - a.paid);

  const dateRange = TRIP.startDate && TRIP.endDate
    ? `${formatDateShort(TRIP.startDate)} to ${formatDateShort(TRIP.endDate)}`.toUpperCase()
    : '';

  return (
    <>
      <Header title="TRIP WRAP" sub={`${TRIP.name}${dateRange ? ' · ' + dateRange : ''}`} onBack={onBack} />
      <div className="body">
        <div className="wrap-hero">
          <div className="wrap-hero-label">TOTAL SPENT</div>
          <div className="wrap-hero-amt">{symbol(tripCurrency)}{fmtMajor(total, tripCurrency)}</div>
          <div className="wrap-hero-sub">over {days} day{days === 1 ? '' : 's'} · {expenses.length} expense{expenses.length === 1 ? '' : 's'}</div>
        </div>

        <div className="wrap-block">
          <div className="lbl">BY THE NUMBERS</div>
          <div className="wrap-stat-row">
            <div className="wrap-stat">
              <div className="v">{symbol(tripCurrency)}{fmtMajor(avgPerDay, tripCurrency)}</div>
              <div className="k">per day</div>
            </div>
            <div className="wrap-stat">
              <div className="v">{symbol(tripCurrency)}{fmtMajor(totalFor(preTrip, { currency: tripCurrency }), tripCurrency)}</div>
              <div className="k">pre-trip</div>
            </div>
            <div className="wrap-stat">
              <div className="v">{topCat ? topCat[0] : '·'}</div>
              <div className="k">top category</div>
            </div>
          </div>
        </div>

        <div className="section-band-dark"><span>WHO PAID MOST</span></div>
        {personTotals.map((p, i) => (
          <div key={p.id} className="wrap-settle-row">
            <Avatar id={p.id} />
            <div style={{flex:1, fontSize:14, fontWeight:600}}>
              {p.name}{i === 0 && personTotals[0].paid > 0 && <span style={{marginLeft: 8, fontSize: 10, color:'#c0392b', fontWeight:700, letterSpacing:'0.1em'}}>★ MOST</span>}
            </div>
            <div className="led-row-amt">{symbol(tripCurrency)}{fmtMajor(p.paid, tripCurrency)}<span className="dec">.{fmtMinor(p.paid)}</span></div>
          </div>
        ))}

        <div className="section-band-dark"><span>FINAL SETTLEMENT</span><span>LOCKED</span></div>
        <Settlement expenses={expenses} settlements={settlements} readonly />

        <div style={{padding: '18px 22px', display:'grid', gridTemplateColumns:'1fr 1fr', gap: 12}}>
          <button className="cta" onClick={() => onToast('Share image coming soon')}>SHARE</button>
          <button className="cta" style={{background:'#0e0e0e', color:'#e9c44b'}} onClick={onBack}>DONE</button>
        </div>

        <div style={{padding: '8px 22px 32px', textAlign:'center', fontSize:11, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:'rgba(14,14,14,0.45)'}}>
          on every trip, dad paid
        </div>
      </div>
    </>
  );
}

function JoinInviteModal({ onJoin, onClose }) {
  const [val, setVal] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState(null);

  function extractCode(s) {
    if (!s) return '';
    const trimmed = s.trim();
    // Try parsing as URL with ?invite=
    const m = trimmed.match(/[?&]invite=([A-Za-z0-9]+)/);
    if (m) return m[1];
    // Otherwise assume it's the bare code (12 hex chars)
    return trimmed.replace(/[^A-Za-z0-9]/g, '');
  }

  async function submit() {
    const code = extractCode(val);
    if (!code) { setErr('Paste an invite link or 12-character code'); return; }
    setBusy(true); setErr(null);
    try {
      await onJoin(code);
      onClose();
    } catch (e) {
      setErr(String(e?.message || e));
      setBusy(false);
    }
  }

  return (
    <>
      <div className="backdrop" onClick={onClose} />
      <div className="invite-modal">
        <div className="invite-title">JOIN A TRIP</div>
        <div className="invite-sub">
          Paste the invite link or 12-character code someone shared with you.
        </div>
        <input
          autoFocus
          className="wiz-input"
          value={val}
          onChange={(e) => setVal(e.target.value)}
          placeholder="invite link or code"
          style={{boxShadow: '3px 3px 0 #0e0e0e', marginBottom: 14}}
          onKeyDown={(e) => e.key === 'Enter' && submit()}
        />
        {err && <div className="login-err" style={{marginBottom: 12}}>{err}</div>}
        <div className="invite-btn-row">
          <button className="invite-btn ghost" onClick={onClose}>CANCEL</button>
          <button className="invite-btn primary" onClick={submit} disabled={busy || !val.trim()}>
            {busy ? 'JOINING…' : 'JOIN ›'}
          </button>
        </div>
      </div>
    </>
  );
}

function InviteModal({ url, tripName, onClose, onToast }) {
  async function copy() {
    try {
      await navigator.clipboard.writeText(url);
      onToast('Link copied');
    } catch { onToast('Copy failed'); }
  }
  async function share() {
    if (navigator.share) {
      try {
        await navigator.share({
          title: `Dad Paid: ${tripName}`,
          text: `Hop on this trip with me. Tap the link to join.`,
          url,
        });
      } catch { /* user cancelled */ }
    } else {
      copy();
    }
  }
  return (
    <>
      <div className="backdrop" onClick={onClose} />
      <div className="invite-modal">
        <div className="invite-title">SHARE WITH GUEST</div>
        <div className="invite-sub">
          Send this link to anyone you want on <strong>{tripName}</strong>. They'll sign in with their own email, then see this trip in their app. Expires in 14 days.
        </div>
        <div className="invite-url-box">{url}</div>
        <div className="invite-btn-row">
          <button className="invite-btn ghost" onClick={onClose}>CLOSE</button>
          <button className="invite-btn primary" onClick={navigator.share ? share : copy}>
            {navigator.share ? 'SHARE ›' : 'COPY ›'}
          </button>
        </div>
        <div className="invite-meta">they'll see all expenses, events, and the settlement</div>
      </div>
    </>
  );
}

   ════════════════════════════════════════════════════════════════════ */

function EditExpenseSheet({ expense, onSave, onDelete, onClose }) {
  const initialMajor = (expense.amount / 100).toFixed(2);
  const [amount, setAmount] = useState(initialMajor.replace(/\.?0+$/, '') || '0');
  const [currency, setCurrency] = useState(expense.currency);
  const [payer, setPayer] = useState(expense.payer);
  const [card, setCard] = useState(expense.card || cardsOf(expense.payer)[0]?.id);
  const [category, setCategory] = useState(expense.category || 'Food');
  const [split, setSplit] = useState(expense.split || 'everyone');
  const [date, setDate] = useState(expense.date);
  const [title, setTitle] = useState(expense.title || '');
  const [splitOpen, setSplitOpen] = useState(false);
  const [busy, setBusy] = useState(false);

  const minorAmount = Math.round(parseFloat(amount || '0') * 100);
  const isZero = minorAmount === 0;
  const [majorStr, decStr] = amount.split('.');
  const hasDot = amount.includes('.');
  const majorDisplay = amount ? fmtMajor(parseInt(majorStr || '0', 10) * 100, currency) : '0';

  function press(d) {
    if (amount.length >= 12) return;
    if (hasDot) {
      const dec = amount.split('.')[1] || '';
      if (dec.length >= 2) return;
    }
    if (amount === '0' && d !== '0') { setAmount(d); return; }
    if (!amount && d === '0') { setAmount('0'); return; }
    setAmount(amount + d);
  }
  function decimal() { if (!hasDot) setAmount((amount || '0') + '.'); }
  function del() { setAmount(amount.slice(0, -1)); }

  async function save() {
    if (isZero) return;
    setBusy(true);
    try {
      await onSave({
        ...expense,
        amount: minorAmount, currency, payer, card,
        category, split, date, title: title.trim() || category,
      });
    } finally { setBusy(false); }
  }

  async function del_() {
    if (!confirm('Delete this expense?')) return;
    setBusy(true);
    try { await onDelete(expense); }
    finally { setBusy(false); }
  }

  return (
    <div className="edit-sheet">
      <div className="edit-head">
        <div className="ttl">EDIT EXPENSE</div>
        <button className="edit-close" onClick={onClose} aria-label="close">×</button>
      </div>

      <div className="edit-body">
        {/* AMOUNT */}
        <div className="kp-top" style={{padding: 0, border: 'none', background: 'transparent'}}>
          <div className={`kp-amount ${isZero ? 'zero' : ''}`} style={{justifyContent: 'center'}}>
            <button
              className="kp-sym-btn sym"
              onClick={() => setCurrency(currency === 'GBP' ? 'INR' : 'GBP')}
            >{symbol(currency)}</button>
            <span>{majorDisplay}{hasDot && '.'}{decStr || ''}</span>
          </div>
        </div>

        {/* CATEGORY scroll */}
        <div className="kp-cats" style={{marginTop: 12, marginLeft: -18, marginRight: -18, paddingLeft: 18, paddingRight: 18}}>
          {CATEGORIES.map((c) => (
            <button key={c} className={`kp-cat ${category === c ? 'active' : ''}`} onClick={() => setCategory(c)}>
              {c.toUpperCase()}
            </button>
          ))}
        </div>

        {/* TITLE */}
        <div className="wiz-label">Title (optional)</div>
        <input
          className="wiz-input"
          value={title}
          onChange={(e) => setTitle(e.target.value)}
          placeholder={category}
        />

        {/* PAYER */}
        <div className="wiz-label">Payer</div>
        <div style={{display: 'flex', gap: 12, alignItems: 'center'}}>
          {FAMILY.members.map((m) => (
            <button
              key={m.id}
              onClick={() => { setPayer(m.id); const cs = cardsOf(m.id); setCard(cs[0]?.id); }}
              style={{background: 'transparent', border: 'none', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, cursor: 'pointer'}}
            >
              <Avatar id={m.id} size="lg" selected={payer === m.id} />
              <span style={{fontSize: 10, fontWeight: 700, letterSpacing: '0.1em', textTransform: 'uppercase', color: payer === m.id ? '#0e0e0e' : 'rgba(14,14,14,0.5)'}}>{m.name}</span>
            </button>
          ))}
        </div>

        {/* CARD */}
        <div className="wiz-label">Payment</div>
        <div style={{display: 'flex', gap: 6, flexWrap: 'wrap'}}>
          {cardsOf(payer).map((c) => (
            <button key={c.id} className={`chip ${card === c.id ? 'chip-active' : ''}`} onClick={() => setCard(c.id)}>
              {c.nick}{c.last4 ? ' ' + c.last4 : ''}
            </button>
          ))}
        </div>

        {/* SPLIT */}
        <div className="wiz-label">Split</div>
        <button className="chip chip-active" onClick={() => setSplitOpen(true)} style={{width: '100%', justifyContent: 'space-between'}}>
          <span>SPLIT · {SPLIT_OPTIONS.find((o) => o.id === split)?.label || split.toUpperCase()}</span>
          <span>▾</span>
        </button>

        {/* DATE */}
        <div className="wiz-label">Date</div>
        <input type="date" className="wiz-input" value={date} onChange={(e) => setDate(e.target.value)} />

        {/* KEYPAD for editing amount */}
        <div className="wiz-label">Amount keypad</div>
        <div style={{display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 6, marginTop: 4}}>
          {[1,2,3,4,5,6,7,8,9].map((n) => (
            <button key={n} className="key" style={{minHeight: 44}} onClick={() => press(String(n))}>{n}</button>
          ))}
          <button className="key" style={{minHeight: 44}} onClick={decimal}>.</button>
          <button className="key" style={{minHeight: 44}} onClick={() => press('0')}>0</button>
          <button className="key" style={{minHeight: 44}} onClick={del}>⌫</button>
        </div>
      </div>

      <div className="edit-foot">
        <button className="del" onClick={del_} disabled={busy}>DELETE</button>
        <button className="save" onClick={save} disabled={busy || isZero}>{busy ? 'SAVING…' : 'SAVE'}</button>
      </div>

      {splitOpen && (
        <>
          <div className="backdrop" onClick={() => setSplitOpen(false)} />
          <div className="sheet">
            <div className="sheet-title">SPLIT</div>
            <div className="sheet-sub">Who's this for?</div>
            {SPLIT_OPTIONS.map((o) => (
              <div key={o.id} className={`sheet-opt ${split === o.id ? 'selected' : ''}`} onClick={() => { setSplit(o.id); setTimeout(() => setSplitOpen(false), 120); }}>
                <div>
                  <div className="sheet-opt-label">{o.label}</div>
                  <div className="sheet-opt-sub">{o.sub}</div>
                </div>
                <div className="sheet-opt-mark">{split === o.id ? '✓' : ''}</div>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

function EditEventSheet({ event, onSave, onDelete, onClose }) {
  const [title, setTitle] = useState(event.title || '');
  const [time, setTime] = useState(event.time || '');
  const [tag, setTag] = useState(event.tag || '');
  const [done, setDone] = useState(!!event.done);
  const [busy, setBusy] = useState(false);
  const valid = title.trim().length > 0;

  async function save() {
    if (!valid) return;
    setBusy(true);
    try { await onSave({ ...event, title: title.trim(), time: time.trim() || null, tag: tag.trim() || null, done }); }
    finally { setBusy(false); }
  }
  async function del_() {
    if (!confirm('Delete this event?')) return;
    setBusy(true);
    try { await onDelete(event); }
    finally { setBusy(false); }
  }

  return (
    <div className="edit-sheet">
      <div className="edit-head">
        <div className="ttl">EDIT EVENT</div>
        <button className="edit-close" onClick={onClose} aria-label="close">×</button>
      </div>
      <div className="edit-body">
        <div className="wiz-label">Title</div>
        <input autoFocus className="wiz-input" value={title} onChange={(e) => setTitle(e.target.value)} placeholder="What's happening?" />

        <div className="wiz-label">Time</div>
        <input className="wiz-input" value={time} onChange={(e) => setTime(e.target.value)} placeholder="e.g. 19:00" style={{fontFamily: 'IBM Plex Mono', fontWeight: 700, maxWidth: 140}} />

        <div className="wiz-label">Tag (optional)</div>
        <input className="wiz-input" value={tag} onChange={(e) => setTag(e.target.value)} placeholder="e.g. BOOKED #84210 or TICKETS IN VAULT" />

        <div className="wiz-label">Status</div>
        <div className="wiz-select-row">
          <div className={`wiz-radio ${!done ? 'active' : ''}`} onClick={() => setDone(false)}>UPCOMING</div>
          <div className={`wiz-radio ${done ? 'active' : ''}`} onClick={() => setDone(true)}>DONE</div>
        </div>
      </div>
      <div className="edit-foot">
        <button className="del" onClick={del_} disabled={busy}>DELETE</button>
        <button className="save" onClick={save} disabled={busy || !valid}>{busy ? 'SAVING…' : 'SAVE'}</button>
      </div>
    </div>
  );
}

function EditMemberSheet({ member, onSave, onDelete, onClose, allowDelete }) {
  const [name, setName] = useState(member?.name || '');
  const [initial, setInitial] = useState(member?.initial || '');
  const [color, setColor] = useState(member?.color || '#e9c44b');
  const [busy, setBusy] = useState(false);
  const valid = name.trim().length > 0;
  const isNew = !member?.id;

  async function save() {
    if (!valid) return;
    setBusy(true);
    try { await onSave({ id: member?.id, name: name.trim(), initial: initial || initialFor(name), color }); }
    finally { setBusy(false); }
  }
  async function del_() {
    if (!confirm(`Remove ${member.name}? Their existing expenses will keep showing their name.`)) return;
    setBusy(true);
    try { await onDelete(member); }
    finally { setBusy(false); }
  }

  return (
    <div className="edit-sheet">
      <div className="edit-head">
        <div className="ttl">{isNew ? 'ADD MEMBER' : 'EDIT MEMBER'}</div>
        <button className="edit-close" onClick={onClose} aria-label="close">×</button>
      </div>
      <div className="edit-body">
        <div className="wiz-label">Name</div>
        <div className="wiz-member-row">
          <div className="wiz-initial" style={{background: color, color: '#0e0e0e'}}>{initial || initialFor(name) || '?'}</div>
          <input autoFocus className="wiz-input-sm" value={name} onChange={(e) => { setName(e.target.value); setInitial(initialFor(e.target.value)); }} placeholder="First name" />
        </div>

        <div className="wiz-label" style={{marginTop: 20}}>Color</div>
        <div className="color-row">
          {MEMBER_COLORS.map((c) => (
            <div
              key={c}
              className={`swatch ${color === c ? 'selected' : ''}`}
              style={{background: c}}
              onClick={() => setColor(c)}
              aria-label={`color ${c}`}
            />
          ))}
        </div>
      </div>
      <div className="edit-foot">
        {!isNew && allowDelete && <button className="del" onClick={del_} disabled={busy}>REMOVE</button>}
        <button className="save" onClick={save} disabled={busy || !valid}>{busy ? 'SAVING…' : (isNew ? 'ADD' : 'SAVE')}</button>
      </div>
    </div>
  );
}

function EditCardSheet({ card, onSave, onDelete, onClose }) {
  const [nick, setNick] = useState(card?.nick || '');
  const [last4, setLast4] = useState(card?.last4 || '');
  const [owner, setOwner] = useState(card?.owner || FAMILY.members[0]?.id || '');
  const [busy, setBusy] = useState(false);
  const valid = nick.trim().length > 0 && owner;
  const isNew = !card?.id;

  async function save() {
    if (!valid) return;
    setBusy(true);
    try { await onSave({ id: card?.id, nick: nick.trim(), last4: last4.trim() || null, owner }); }
    finally { setBusy(false); }
  }
  async function del_() {
    if (!confirm(`Remove ${card.nick}? Existing expenses keep their card reference.`)) return;
    setBusy(true);
    try { await onDelete(card); }
    finally { setBusy(false); }
  }

  return (
    <div className="edit-sheet">
      <div className="edit-head">
        <div className="ttl">{isNew ? 'ADD CARD' : 'EDIT CARD'}</div>
        <button className="edit-close" onClick={onClose} aria-label="close">×</button>
      </div>
      <div className="edit-body">
        <div className="wiz-label">Nickname</div>
        <input autoFocus className="wiz-input" value={nick} onChange={(e) => setNick(e.target.value)} placeholder="e.g. HDFC Forex, Amex Plat" />

        <div className="wiz-label">Last 4 digits (optional)</div>
        <input
          className="wiz-input"
          value={last4}
          onChange={(e) => setLast4(e.target.value.replace(/\D/g, '').slice(0, 4))}
          placeholder="4521"
          inputMode="numeric"
          style={{maxWidth: 140}}
        />

        <div className="wiz-label">Owner</div>
        <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6}}>
          {FAMILY.members.map((m) => (
            <div key={m.id} className={`wiz-radio ${owner === m.id ? 'active' : ''}`} onClick={() => setOwner(m.id)}>
              {m.name.toUpperCase()}
            </div>
          ))}
        </div>
      </div>
      <div className="edit-foot">
        {!isNew && <button className="del" onClick={del_} disabled={busy}>REMOVE</button>}
        <button className="save" onClick={save} disabled={busy || !valid}>{busy ? 'SAVING…' : (isNew ? 'ADD' : 'SAVE')}</button>
      </div>
    </div>
  );
}

// pickGreeting and formatDateShort live in lib/helpers.js.

function HubScreen({ family, userFamily, activeTrip, pastTrips, expenses, online, onOpenTrip, onNewTrip, onJoinInvite, onSignOut }) {
  const isJoinedTrip = (t) => !!t && (!userFamily || t.family_id !== userFamily.id);
  const greeting = pickGreeting();

  const activeTotal = activeTrip
    ? expenses.reduce((sum, e) => e.currency === (activeTrip.primary_currency || 'GBP') ? sum + e.amount : sum, 0)
    : 0;
  const activeDays = activeTrip
    ? Math.max(1, Math.round((new Date(activeTrip.end_date) - new Date(activeTrip.start_date)) / 86400000) + 1)
    : 0;
  const activeCurrent = activeTrip
    ? Math.max(1, Math.min(activeDays, Math.floor((Date.now() - new Date(activeTrip.start_date).getTime()) / 86400000) + 1))
    : 0;

  const familyName = family?.name || 'family';

  return (
    <div className="hub-stage">
      <div className="hub-head">
        <div className="hub-brand">DAD PAID</div>
        <div className="hub-brand-sub">{familyName}'s travel ledger. mild guilt, lightly tracked.</div>
      </div>

      <div className="hub-body">
        <div className="hub-greeting">{greeting}</div>

        {activeTrip && (
          <div className="hub-active">
            <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'center'}}>
              <div className="hub-active-tag">currently in</div>
              {isJoinedTrip(activeTrip) && <span className="joined-badge">JOINED</span>}
            </div>
            <div className="hub-active-name">{activeTrip.name}</div>
            <div className="hub-active-meta">
              day {activeCurrent} of {activeDays} · {symbol(activeTrip.primary_currency || 'GBP')}{fmtMajor(activeTotal, activeTrip.primary_currency || 'GBP')} so far
            </div>
            <button className="hub-active-cta" onClick={onOpenTrip}>open trip ›</button>
          </div>
        )}

        <div className="hub-actions">
          <button className="hub-actionbtn" onClick={onNewTrip}>+ new trip</button>
          <button className="hub-actionbtn" onClick={onJoinInvite}>join with code</button>
        </div>

        {pastTrips.length > 0 && (
          <>
            <div className="hub-section">
              <span>the archive</span>
              <span className="ct">{pastTrips.length}</span>
            </div>
            {pastTrips.map((t) => (
              <div key={t.id} className="hub-trip-card">
                <div style={{flex: 1, minWidth: 0}}>
                  <div className="nm">{t.name}</div>
                  <div className="dt">
                    {formatDateShort(t.start_date)} to {formatDateShort(t.end_date)} · {t.primary_currency}
                  </div>
                </div>
                <div style={{display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4}}>
                  {isJoinedTrip(t) && <span className="joined-badge">JOINED</span>}
                  <div className="badge">ended</div>
                </div>
              </div>
            ))}
          </>
        )}

        {pastTrips.length === 0 && !activeTrip && (
          <div className="hub-empty">
            <div className="big">no trips yet.</div>
            it's quiet. shiny new keypad,<br />vague sense of optimism.
          </div>
        )}

        <button className="hub-signout" onClick={onSignOut}>sign out</button>
      </div>
    </div>
  );
}

/* ════════════════════════════════════════════════════════════════════
   APP
   ════════════════════════════════════════════════════════════════════ */

function App() {
  const { user, loading: authLoading } = useAuth();
  const online = useOnline();
  const [bootDone, setBootDone] = useState(false);
  const [, bumpVersion] = useState(0);                 // force re-render after FAMILY/TRIP mutate
  const forceRender = () => bumpVersion((v) => v + 1);

  // Bootstrapped from Supabase. Empty members → onboarding. Empty trip → "no trip" screen.
  const [snapshotState, setSnapshotState] = useState({ family: null, userFamily: null, members: [], trip: null, pastTrips: [], participants: [] });
  const [inviteModal, setInviteModal] = useState(null); // { code, url, tripName } when generating
  const [joinModalOpen, setJoinModalOpen] = useState(false);
  const [a2hsSeen, setA2hsSeen] = usePersistedState('dp.a2hs.seen', false);
  const [showA2hs, setShowA2hs] = useState(false);

  const [view, setView] = useState('hub');             // 'hub' | 'trip' | 'new-trip'
  const [tab, setTab] = useState('add');
  const [overlay, setOverlay] = useState(null);        // null | 'settings' | 'wrap'
  const [photoExpense, setPhotoExpense] = useState(null);
  const [editExpense, setEditExpense] = useState(null);
  const [editEvent, setEditEvent] = useState(null);
  const [editMember, setEditMember] = useState(null);   // member object or { id: null } for new
  const [editCard, setEditCard] = useState(null);

  // Offline-tolerant cache. Hydrates from localStorage instantly; replaced by server on load.
  const [expenses, setExpenses] = usePersistedState('dp.expenses', []);
  const [events,   setEvents]   = usePersistedState('dp.events',   []);
  const [vault,    setVault]    = usePersistedState('dp.vault',    []);
  const [settlements, setSettlements] = usePersistedState('dp.settlements', []);
  const [pendingSettle, setPendingSettle] = useState(null); // active transfer to mark settled
  const [lastSyncedAt, setLastSyncedAt] = useState(null);
  const [demoActive, setDemoActive] = useState(false);
  const [demoDismissed, setDemoDismissed] = useState(false);

  // Pending-ops queue — every mutation is appended; drained when online + authed.
  const [pendingOps, setPendingOps] = usePersistedState('dp.pending', []);

  const [toast, setToast] = useState(null);
  const todayDate = new Date().toISOString().slice(0, 10);
  // Re-evaluate sync state periodically so the "LIVE" dot fades to nothing
  // after the 30s window without forcing every render to chase a moving clock.
  const [syncTick, setSyncTick] = useState(0);
  useEffect(() => {
    if (!online || !lastSyncedAt) return;
    const t = setInterval(() => setSyncTick((n) => n + 1), 5000);
    return () => clearInterval(t);
  }, [online, lastSyncedAt]);
  const syncLive = syncStatus(Date.now(), lastSyncedAt, online) === 'live';
  // (syncTick is read implicitly via Date.now() inside the line above)
  void syncTick;

  // Which family_member represents the signed-in user in the current trip?
  // For the owner family it's their first member. For joined trips it's the
  // member created in accept_invite, looked up via trip_participants.
  const myMemberId = useMemo(() => {
    if (!user) return null;
    const myPart = (snapshotState.participants || []).find((p) => p.user_id === user.id);
    if (myPart?.member_id) return myPart.member_id;
    if (snapshotState.userFamily && snapshotState.family && snapshotState.userFamily.id === snapshotState.family.id) {
      return snapshotState.members?.[0]?.id || null;
    }
    return null;
  }, [user, snapshotState]);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  /* ── INITIAL LOAD ────────────────────────────────────────────────── */
  const refreshAll = async () => {
    try {
      let snap = await loadAll();
      // Fallback: if no family row exists (trigger missed or data truncated),
      // create one from the client. RLS allows the user to insert their own.
      if (!snap && user) {
        const defaultName = user.email ? user.email.split('@')[0] : 'New family';
        const { error: cErr } = await sb.from('families').insert({ name: defaultName, owner_id: user.id });
        if (!cErr) snap = await loadAll();
      }
      if (!snap) { setSnapshotState({ family: null, userFamily: null, members: [], trip: null, pastTrips: [], participants: [] }); return; }
      setSnapshotState({
        family: snap.family,
        userFamily: snap.userFamily,
        members: snap.members,
        trip: snap.trip,
        pastTrips: snap.pastTrips || [],
        participants: snap.participants || [],
      });
      applyServerSnapshot(snap);
      setExpenses(snap.expenses.map(expenseFromDB));
      setEvents(snap.events.map(eventFromDB));
      setVault(snap.vault.map((v) => ({ id: v.id, name: v.name, meta: v.meta || '' })));
      setSettlements(snap.settlements || []);
      setLastSyncedAt(Date.now());
      if (snap.trip) {
        const startMs = new Date(snap.trip.start_date).getTime();
        const todayMs = new Date(todayDate).getTime();
        const day = Math.max(1, Math.min(TRIP.totalDays, Math.floor((todayMs - startMs) / 86400000) + 1));
        TRIP.currentDay = day;
      }
      forceRender();
    } catch (e) { console.warn('refresh failed', e); }
  };

  useEffect(() => {
    if (!user || !online) { if (!user) setBootDone(true); return; }
    let alive = true;
    (async () => {
      // First, accept any pending invite captured from the URL. This must happen
      // BEFORE the snapshot load so the user's first refreshAll sees the new trip.
      const result = await acceptPendingInvite();
      if (alive && result) {
        if (result.error) {
          showToast(result.error);
        } else if (result.ok && !result.already && !result.self) {
          showToast('Joined trip');
        }
      }
      await refreshAll();
      if (alive) setBootDone(true);
    })();
    return () => { alive = false; };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [user, online]);

  /* ── WRITE QUEUE FLUSHER ─────────────────────────────────────────── */
  const flushing = useRef(false);
  useEffect(() => {
    if (!user || !online || pendingOps.length === 0 || flushing.current) return;
    flushing.current = true;
    (async () => {
      const ops = pendingOps;
      const remaining = [];
      let flushed = 0;
      for (const op of ops) {
        try {
          await runQueuedOp(op);
          flushed++;
          // mark synced in local state
          if (op.type === 'expense.insert' || op.type === 'expense.update') {
            setExpenses((prev) => prev.map((e) => e.id === op.payload.id ? { ...e, synced: true } : e));
          } else if (op.type === 'event.insert' || op.type === 'event.update') {
            setEvents((prev) => prev.map((v) => v.id === op.payload.id ? { ...v, synced: true } : v));
          }
        } catch (e) {
          remaining.push({ ...op, attempts: (op.attempts || 0) + 1, lastError: String(e?.message || e) });
        }
      }
      setPendingOps(remaining);
      flushing.current = false;
      if (flushed > 0) showToast(`Synced ${flushed} ${flushed === 1 ? 'entry' : 'entries'}`);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [user, online, pendingOps.length]);

  /* ── REALTIME ────────────────────────────────────────────────────── */
  useEffect(() => {
    if (!user || !TRIP.id) return;
    const ch = sb.channel(`trip:${TRIP.id}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses', filter: `trip_id=eq.${TRIP.id}` }, (p) => {
        if (p.eventType === 'DELETE') {
          setExpenses((prev) => prev.filter((e) => e.id !== p.old.id));
        } else {
          const incoming = expenseFromDB(p.new);
          setExpenses((prev) => {
            const ix = prev.findIndex((e) => e.id === incoming.id);
            if (ix === -1) return [...prev, incoming];
            const next = prev.slice(); next[ix] = { ...next[ix], ...incoming }; return next;
          });
        }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'events', filter: `trip_id=eq.${TRIP.id}` }, (p) => {
        if (p.eventType === 'DELETE') {
          setEvents((prev) => prev.filter((e) => e.id !== p.old.id));
        } else {
          const incoming = eventFromDB(p.new);
          setEvents((prev) => {
            const ix = prev.findIndex((e) => e.id === incoming.id);
            if (ix === -1) return [...prev, incoming].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            const next = prev.slice(); next[ix] = { ...next[ix], ...incoming }; return next;
          });
        }
      })
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, [user, TRIP.id]);

  /* ── MUTATIONS — optimistic + enqueue ────────────────────────────── */
  function enqueue(op) { setPendingOps((prev) => [...prev, op]); }

  async function runQueuedOp(op) {
    switch (op.type) {
      case 'expense.insert': {
        const { error } = await sb.from('expenses').insert(op.payload);
        if (error) throw error;
        if (op.photoDataUrl && FAMILY.id) {
          const path = await uploadPhotoFromDataUrl(op.photoDataUrl, FAMILY.id, op.payload.id);
          if (path) await sb.from('expenses').update({ has_photo: true, photo_path: path }).eq('id', op.payload.id);
        }
        return;
      }
      case 'expense.update': {
        const { id, ...patch } = op.payload;
        const { error } = await sb.from('expenses').update(patch).eq('id', id);
        if (error) throw error;
        return;
      }
      case 'expense.delete': {
        const { error } = await sb.from('expenses').delete().eq('id', op.id);
        if (error) throw error;
        if (op.photoPath) await sb.storage.from('photos').remove([op.photoPath]).catch(() => {});
        return;
      }
      case 'event.insert': {
        const { error } = await sb.from('events').insert(op.payload);
        if (error) throw error;
        return;
      }
      case 'event.update': {
        const { id, ...patch } = op.payload;
        const { error } = await sb.from('events').update(patch).eq('id', id);
        if (error) throw error;
        return;
      }
      case 'event.delete': {
        const { error } = await sb.from('events').delete().eq('id', op.id);
        if (error) throw error;
        return;
      }
      default: console.warn('unknown op', op.type);
    }
  }

  function addExpense(e) {
    const { photo, ...rest } = e;
    const record = { ...rest, hasPhoto: !!photo, synced: demoActive ? true : false };
    if (photo) putPhoto(e.id, photo);
    setExpenses((prev) => [...prev, record]);
    if (demoActive) return;  // sandbox mode: don't persist to Supabase
    enqueue({ type: 'expense.insert', payload: expenseToDB(record, TRIP.id), photoDataUrl: photo || null });
  }

  function addEvent(v) {
    const record = { ...v, synced: demoActive ? true : false };
    setEvents((prev) => [...prev, record].sort((a, b) => (a.time || '').localeCompare(b.time || '')));
    if (demoActive) return;
    enqueue({ type: 'event.insert', payload: eventToDB(record, TRIP.id) });
  }

  function toggleEvent(id) {
    let updated = null;
    setEvents((prev) => prev.map((e) => {
      if (e.id !== id) return e;
      updated = { ...e, done: !e.done, synced: false };
      return updated;
    }));
    if (updated) enqueue({ type: 'event.update', payload: { id, done: updated.done } });
  }

  function updateExpense(updated) {
    setExpenses((prev) => prev.map((e) => e.id === updated.id ? { ...updated, synced: false } : e));
    enqueue({ type: 'expense.update', payload: expenseToDB(updated, TRIP.id) });
    setEditExpense(null);
    showToast('Expense updated');
  }
  function deleteExpense(e) {
    setExpenses((prev) => prev.filter((x) => x.id !== e.id));
    enqueue({ type: 'expense.delete', id: e.id, photoPath: e.photoPath || null });
    deletePhoto(e.id).catch(() => {});
    setEditExpense(null);
    showToast('Expense deleted');
  }
  function updateEvent(updated) {
    setEvents((prev) => prev.map((e) => e.id === updated.id ? { ...updated, synced: false } : e)
      .sort((a, b) => (a.time || '').localeCompare(b.time || '')));
    enqueue({ type: 'event.update', payload: { id: updated.id, title: updated.title, time: updated.time, tag: updated.tag, done: updated.done } });
    setEditEvent(null);
    showToast('Event updated');
  }
  function deleteEventLocal(e) {
    setEvents((prev) => prev.filter((x) => x.id !== e.id));
    enqueue({ type: 'event.delete', id: e.id });
    setEditEvent(null);
    showToast('Event deleted');
  }

  // Family/card CRUD — direct Supabase calls (Settings is online-required).
  async function saveMember(m) {
    if (!FAMILY.id) return;
    if (m.id) {
      const { error } = await sb.from('family_members').update({ name: m.name, initial: m.initial, color: m.color }).eq('id', m.id);
      if (error) { showToast('Save failed'); return; }
    } else {
      const newId = uid('mem');
      const { error } = await sb.from('family_members').insert({
        id: newId, family_id: FAMILY.id, name: m.name, initial: m.initial, color: m.color,
        position: FAMILY.members.length,
      });
      if (error) { showToast('Add failed'); return; }
    }
    await refreshAll();
    setEditMember(null);
    showToast(m.id ? 'Member updated' : 'Member added');
  }
  async function deleteMemberLocal(m) {
    if (FAMILY.members.length <= 1) { showToast('Need at least 1 member'); return; }
    const expensesForMember = expenses.filter((e) => e.payer === m.id).length;
    if (expensesForMember > 0) {
      const ok = confirm(`Remove ${m.name}? Their ${expensesForMember} expense${expensesForMember === 1 ? '' : 's'} on this trip will be deleted too.`);
      if (!ok) return;
    }
    const { error } = await sb.from('family_members').delete().eq('id', m.id);
    if (error) { showToast('Remove failed.'); return; }
    await refreshAll();
    setEditMember(null);
    showToast('Member removed');
  }
  async function saveCard(c) {
    if (!FAMILY.id) return;
    if (c.id) {
      const { error } = await sb.from('family_cards').update({ nick: c.nick, last4: c.last4, owner_member_id: c.owner }).eq('id', c.id);
      if (error) { showToast('Save failed'); return; }
    } else {
      const { error } = await sb.from('family_cards').insert({
        id: uid('card'), family_id: FAMILY.id,
        owner_member_id: c.owner, nick: c.nick, last4: c.last4,
        position: FAMILY.cards.length,
      });
      if (error) { showToast('Add failed'); return; }
    }
    await refreshAll();
    setEditCard(null);
    showToast(c.id ? 'Card updated' : 'Card added');
  }
  async function deleteCardLocal(c) {
    const { error } = await sb.from('family_cards').delete().eq('id', c.id);
    if (error) { showToast('Remove failed'); return; }
    await refreshAll();
    setEditCard(null);
    showToast('Card removed');
  }

  const openSettings = () => setOverlay('settings');
  const closeOverlay = () => setOverlay(null);

  async function generateInvite() {
    if (!TRIP.id) return;
    try {
      const code = await createInviteForTrip(TRIP.id);
      setInviteModal({ code, url: inviteUrl(code), tripName: TRIP.name });
    } catch (e) {
      showToast(e?.message || 'Could not create invite');
    }
  }

  async function markSettled(transfer) {
    if (!TRIP.id) return;
    const row = {
      trip_id: TRIP.id,
      from_member_id: transfer.from,
      to_member_id: transfer.to,
      amount: transfer.amount,
      currency: transfer.currency,
      method: transfer.method || 'Cash',
      note: transfer.note || null,
    };
    const { data, error } = await sb.from('settlements').insert(row).select().single();
    if (error) { showToast('Could not record: ' + error.message); return; }
    setSettlements((prev) => [data, ...prev]);
    setLastSyncedAt(Date.now());
    setPendingSettle(null);
    showToast('Settled');
  }
  async function undoSettlement(s) {
    if (!confirm('Undo this settlement? The debt comes back into the outstanding list.')) return;
    const { error } = await sb.from('settlements').delete().eq('id', s.id);
    if (error) { showToast('Could not undo: ' + error.message); return; }
    setSettlements((prev) => prev.filter((x) => x.id !== s.id));
    setLastSyncedAt(Date.now());
    showToast('Settlement removed');
  }

  async function joinByCode(code) {
    const { data, error } = await sb.rpc('accept_invite', { p_code: code });
    if (error) throw new Error(error.message);
    if (data?.error) throw new Error(data.error);
    if (data?.self) { showToast("That's your own trip"); return; }
    if (data?.already) { showToast('Already in that trip'); }
    else { showToast('Joined trip'); }
    await refreshAll();
    setView('hub');
  }

  async function endTrip() {
    if (!confirm('End this trip? You can start a new one right after. Past trip stays in your archive.')) return;
    try {
      if (TRIP.id) {
        const { error } = await sb.from('trips').update({ status: 'ended' }).eq('id', TRIP.id);
        if (error) { showToast('Could not end trip. Try again.'); return; }
      }
    } catch { showToast('Could not end trip'); return; }
    setOverlay('wrap');
  }

  async function closeWrap() {
    setOverlay(null);
    await refreshAll();
    setView('hub');  // land back on the hub with the just-ended trip in the archive
  }

  async function signOut() {
    await sb.auth.signOut();
    // Clear all local app state so the next account starts clean.
    ['dp.expenses', 'dp.events', 'dp.vault', 'dp.pending'].forEach((k) => localStorage.removeItem(k));
    setExpenses([]); setEvents([]); setVault([]); setPendingOps([]);
    showToast('Signed out');
  }

  /* ── DEMO MODE — unauthenticated visitors get a sample trip ───────── */
  useEffect(() => {
    if (user) { setDemoActive(false); return; }
    if (demoDismissed) { setDemoActive(false); return; }
    if (authLoading) return;
    // Inject the demo snapshot
    const snap = buildDemoSnapshot();
    applyServerSnapshot(snap);
    setSnapshotState({
      family: snap.family,
      userFamily: snap.family,
      members: snap.members,
      trip: snap.trip,
      pastTrips: [],
      participants: [],
    });
    setExpenses(snap.expenses.map(expenseFromDB));
    setEvents([]);
    setVault([]);
    setSettlements([]);
    setDemoActive(true);
    setView('trip');
    setTab('add');
    setBootDone(true);
    forceRender();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [user, demoDismissed, authLoading]);

  /* ── RENDER GATES ────────────────────────────────────────────────── */
  if (authLoading) {
    return <div className="stage"><div className="phone"><div className="island" /><div className="boot"><div className="boot-dot" /></div></div></div>;
  }
  if (!user && demoDismissed) {
    return <div className="stage"><div className="phone"><div className="island" /><LoginScreen /></div></div>;
  }
  if (!bootDone) {
    return <div className="stage"><div className="phone"><div className="island" /><div className="boot"><div className="boot-dot" /></div></div></div>;
  }

  // No members yet → onboarding wizard
  if (snapshotState.family && snapshotState.members.length === 0) {
    return (
      <div className="stage">
        <div className="phone">
          <div className="island" />
          <OnboardingScreen
            familyId={snapshotState.family.id}
            userEmail={user.email}
            onComplete={async () => {
              await refreshAll();
              setView('hub');
              if (!a2hsSeen && detectPlatform() !== 'installed' && detectPlatform() !== 'desktop') {
                setShowA2hs(true);
              }
            }}
            onSignOut={signOut}
          />
        </div>
      </div>
    );
  }

  // Just finished onboarding → "Add to Home Screen" prompt (one-time)
  if (showA2hs) {
    return (
      <div className="stage">
        <div className="phone">
          <div className="island" />
          <AddToHomeScreen onDone={() => { setA2hsSeen(true); setShowA2hs(false); }} />
        </div>
      </div>
    );
  }

  // Hub is the default landing (after login, after ending a trip, after onboarding)
  if (view === 'hub') {
    return (
      <div className="stage">
        <div className="phone">
          <div className="island" />
          <HubScreen
            family={snapshotState.family}
            userFamily={snapshotState.userFamily}
            activeTrip={snapshotState.trip}
            pastTrips={snapshotState.pastTrips}
            expenses={expenses}
            online={online}
            onOpenTrip={() => setView('trip')}
            onNewTrip={() => setView('new-trip')}
            onJoinInvite={() => setJoinModalOpen(true)}
            onSignOut={signOut}
          />
          {joinModalOpen && (
            <JoinInviteModal onJoin={joinByCode} onClose={() => setJoinModalOpen(false)} />
          )}
          <div className="home-bar" />
          {toast && <div className="toast">{toast}</div>}
        </div>
      </div>
    );
  }

  // New trip wizard (reached from hub's "Start a new trip" button)
  if (view === 'new-trip') {
    return (
      <div className="stage">
        <div className="phone">
          <div className="island" />
          <NoTripScreen
            familyId={snapshotState.family.id}
            members={snapshotState.members}
            pastTrips={snapshotState.pastTrips}
            onComplete={async () => { await refreshAll(); setView('trip'); }}
            onSignOut={() => setView('hub')}
            cancelLabel="← back to home"
          />
        </div>
      </div>
    );
  }

  // view === 'trip' but no active trip → fall back to hub (defensive)
  if (!snapshotState.trip) {
    setView('hub');
    return null;
  }

  return (
    <div className="stage">
      <div className={`phone ${demoActive ? 'with-demo' : ''}`}>
        <div className="island" />
        {demoActive && (
          <div className="demo-banner">
            <span>SAMPLE DATA · tap around, nothing saves</span>
            <button className="signin" onClick={() => setDemoDismissed(true)}>SIGN IN</button>
          </div>
        )}
        <div className="screen">
          {!overlay && tab === 'add'     && <KeypadScreen   expenses={expenses} todayDate={todayDate} online={online} syncLive={syncLive} onAdd={addExpense} onToast={showToast} onGear={openSettings} onHome={() => setView('hub')} />}
          {!overlay && tab === 'log'     && <LedgerScreen   expenses={expenses} todayDate={todayDate} online={online} syncLive={syncLive} onGear={openSettings} onHome={() => setView('hub')} onOpenPhoto={setPhotoExpense} onOpenEdit={setEditExpense} myMemberId={myMemberId} />}
          {!overlay && tab === 'summary' && <SummaryScreen  expenses={expenses} settlements={settlements} todayDate={todayDate} online={online} syncLive={syncLive} onGear={openSettings} onHome={() => setView('hub')} onMarkSettled={setPendingSettle} onUndoSettlement={undoSettlement} />}
          {!overlay && tab === 'next'    && <TomorrowScreen events={events} vault={vault} online={online} syncLive={syncLive} onToggleEvent={toggleEvent} onAddEvent={addEvent} onGear={openSettings} onHome={() => setView('hub')} onEditEvent={setEditEvent} />}
          {overlay === 'settings' && <SettingsScreen
            expenses={expenses}
            online={online}
            pendingCount={pendingOps.length}
            userEmail={user.email}
            participants={snapshotState.participants}
            isOwner={!!snapshotState.userFamily && snapshotState.family && snapshotState.userFamily.id === snapshotState.family.id}
            onBack={closeOverlay}
            onEndTrip={endTrip}
            onToast={showToast}
            onSignOut={signOut}
            onEditMember={setEditMember}
            onEditCard={setEditCard}
            onInvite={generateInvite}
          />}
          {overlay === 'wrap'     && <TripWrapScreen expenses={expenses} settlements={settlements} onBack={closeWrap} onToast={showToast} />}
          {!overlay && <BottomNav tab={tab} onTab={setTab} />}
        </div>
        <div className="home-bar" />
        {toast && <div className="toast">{toast}</div>}
        {photoExpense && <PhotoLightbox expense={photoExpense} onClose={() => setPhotoExpense(null)} />}
        {inviteModal && <InviteModal url={inviteModal.url} tripName={inviteModal.tripName} onClose={() => setInviteModal(null)} onToast={showToast} />}
        {editExpense && <EditExpenseSheet expense={editExpense} onSave={updateExpense} onDelete={deleteExpense} onClose={() => setEditExpense(null)} />}
        {editEvent && <EditEventSheet event={editEvent} onSave={updateEvent} onDelete={deleteEventLocal} onClose={() => setEditEvent(null)} />}
        {editMember !== null && <EditMemberSheet member={editMember.id ? editMember : null} allowDelete={FAMILY.members.length > 2} onSave={saveMember} onDelete={deleteMemberLocal} onClose={() => setEditMember(null)} />}
        {editCard !== null && <EditCardSheet card={editCard.id ? editCard : null} onSave={saveCard} onDelete={deleteCardLocal} onClose={() => setEditCard(null)} />}
        {pendingSettle && <MarkSettledModal transfer={pendingSettle} onConfirm={markSettled} onClose={() => setPendingSettle(null)} />}
      </div>
      <div className="rotate-prompt" aria-hidden="true">
        <div className="glyph">↻</div>
        <div className="lbl">ROTATE TO PORTRAIT</div>
        <div className="sub">Dad Paid works best held upright</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
