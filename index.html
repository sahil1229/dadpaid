<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#d6ad32" />
<title>Dad Paid</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Funnel+Display:wght@600;700;800;900&family=Funnel+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /* ─────────────────────────── BASE ─────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Funnel Sans', system-ui, -apple-system, sans-serif;
    background: #0e0e0e;
    color: #0e0e0e;
    overscroll-behavior: none;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  input { font: inherit; color: inherit; }

  /* ─────────────────────────── STAGE & PHONE ─────────────────────────── */
  .stage {
    width: 100vw; min-height: 100vh; min-height: 100dvh;
    background: #0e0e0e;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    overflow: hidden;
  }
  .phone {
    width: 402px; height: 874px; flex-shrink: 0;
    border-radius: 48px; overflow: hidden; position: relative;
    background: #fffaf0;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35), 0 0 0 4px #1a1a1a, 0 0 0 5px #2a2a2a;
  }
  .island {
    position: absolute; top: 11px; left: 50%; transform: translateX(-50%);
    width: 126px; height: 37px; border-radius: 24px; background: #000;
    z-index: 50; pointer-events: none;
  }
  .home-bar {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 139px; height: 5px; border-radius: 100px;
    background: rgba(14,14,14,0.3); z-index: 60; pointer-events: none;
  }
  .screen {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: #fffaf0; color: #0e0e0e;
    font-weight: 500;
    overflow: hidden;
  }
  .screen *::-webkit-scrollbar { display: none; }
  .screen * { scrollbar-width: none; }

  /* Phone on mobile takes the entire viewport */
  @media (max-width: 480px) {
    .stage { padding: 0; min-height: 100dvh; }
    .phone {
      width: 100vw; height: 100vh; height: 100dvh;
      border-radius: 0;
      box-shadow: none;
    }
    .island { display: none; }
    .home-bar { display: none; }
    .header { padding-top: calc(env(safe-area-inset-top) + 8px); }
    .nav { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  }

  /* Shorter phones: tighten everything */
  @media (max-height: 740px) {
    .key { font-size: 22px; box-shadow: 2px 2px 0 #0e0e0e; }
    .key:active { box-shadow: 1px 1px 0 #0e0e0e; }
    .kp-amount { font-size: 36px; }
    .kp-amount .sym { font-size: 24px; }
    .ava-lg { width: 42px; height: 42px; font-size: 15px; }
    .kp-pad { padding: 8px 10px 12px; gap: 5px; }
    .cta { padding: 10px; font-size: 17px; box-shadow: 3px 3px 0 #0e0e0e; }
  }

  /* ─────────────────────────── HEADER ─────────────────────────── */
  .header {
    background: #0e0e0e; color: #fffaf0;
    padding: 14px 22px 12px;
    flex-shrink: 0;
  }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .h-title {
    font-family: 'Funnel Display'; font-weight: 800; font-size: 24px;
    letter-spacing: -0.01em; line-height: 1;
    color: #e9c44b;
  }
  .h-sub {
    margin-top: 5px; font-size: 11px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: rgba(255,250,240,0.65);
  }
  .h-right {
    font-family: 'Funnel Display'; font-weight: 700; font-size: 13px;
    letter-spacing: 0.08em; text-align: right;
    color: #e9c44b; line-height: 1.2;
  }
  .h-right-sub { color: rgba(255,250,240,0.55); font-weight: 500; font-size: 10px; margin-top: 4px; }
  .h-offline {
    display: inline-flex; align-items: center; gap: 5px;
    background: #c0392b; color: #fffaf0;
    padding: 3px 8px; border-radius: 999px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
    margin-top: 4px;
  }
  .h-offline .pulse { width: 5px; height: 5px; border-radius: 50%; background: #fffaf0; }
  .led-row-unsynced .led-row-amt::after {
    content: '·'; display: inline-block; color: #c0392b; margin-left: 4px;
    font-weight: 800;
  }

  /* ─────────────────────────── BOTTOM NAV ─────────────────────────── */
  .nav {
    flex-shrink: 0;
    background: #0e0e0e;
    padding: 12px 18px 22px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .nav-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    color: rgba(233, 196, 75, 0.55);
    font-size: 9px; font-weight: 700; letter-spacing: 0.14em;
    transition: color 0.1s;
  }
  .nav-btn.active { color: #e9c44b; }
  .nav-btn:active { transform: translateY(1px); }
  .nav-btn svg { display: block; }

  /* ─────────────────────────── CONTENT BODY ─────────────────────────── */
  .body { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }

  /* ─────────────────────────── SHARED ─────────────────────────── */
  .section-band {
    background: #e9c44b;
    padding: 10px 22px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: #0e0e0e;
    border-top: 2px solid #0e0e0e; border-bottom: 2px solid #0e0e0e;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .section-band-dark {
    background: #0e0e0e; color: #e9c44b;
    padding: 8px 22px;
    font-size: 10px; font-weight: 700; letter-spacing: 0.14em;
    text-transform: uppercase;
    display: flex; justify-content: space-between; align-items: center;
  }
  .row {
    padding: 14px 22px;
    background: #fffaf0;
    border-bottom: 1.5px solid rgba(14,14,14,0.08);
    display: flex; align-items: center; gap: 14px;
  }
  .row-alt { background: #f1ecdf; }
  .row:last-child { border-bottom: none; }

  /* avatars */
  .ava {
    width: 36px; height: 36px; border-radius: 50%;
    background: #0e0e0e; color: #e9c44b;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Funnel Display'; font-weight: 700; font-size: 14px;
    flex-shrink: 0;
  }
  .ava-lg { width: 56px; height: 56px; font-size: 22px; }
  .ava-outline {
    background: transparent; color: #0e0e0e;
    border: 2px solid #0e0e0e;
  }

  /* chips & pills */
  .chip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    background: transparent; color: #0e0e0e;
    border: 2px solid #0e0e0e;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase;
    transition: transform 0.04s, box-shadow 0.04s;
    cursor: pointer;
  }
  .chip-active { background: #0e0e0e; color: #e9c44b; }
  .chip-mustard { background: #e9c44b; color: #0e0e0e; }
  .chip:active { transform: translate(1px, 1px); }

  /* keypad keys — fill grid cell, never overflow */
  .key {
    background: #fffaf0; color: #0e0e0e;
    border: 2px solid #0e0e0e;
    border-radius: 4px;
    box-shadow: 3px 3px 0 #0e0e0e;
    font-family: 'Funnel Display'; font-weight: 800; font-size: 26px;
    min-height: 0;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.04s, box-shadow 0.04s;
    cursor: pointer;
    user-select: none;
  }
  .key:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 #0e0e0e;
  }
  .key-mustard { background: #e9c44b; }

  /* large CTA */
  .cta {
    background: #e9c44b; color: #0e0e0e;
    border: 2px solid #0e0e0e;
    border-radius: 4px;
    box-shadow: 4px 4px 0 #0e0e0e;
    font-family: 'Funnel Display'; font-weight: 800; font-size: 20px;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 14px;
    width: 100%;
    transition: transform 0.04s, box-shadow 0.04s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .cta:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #0e0e0e; }
  .cta-disabled { background: rgba(233,196,75,0.5); color: rgba(14,14,14,0.4); box-shadow: 4px 4px 0 rgba(14,14,14,0.2); pointer-events: none; }

  /* ─────────────────────────── KEYPAD SCREEN ─────────────────────────── */
  .kp-body { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .kp-top {
    padding: 12px 18px 10px; background: #fffaf0;
    border-bottom: 2px solid #0e0e0e;
    flex-shrink: 0;
  }
  .kp-amount {
    font-family: 'IBM Plex Mono'; font-weight: 700;
    font-size: 44px; line-height: 1;
    letter-spacing: -0.03em; color: #0e0e0e;
    display: flex; align-items: baseline; gap: 4px;
    margin: 0 0 8px;
  }
  .kp-amount.zero { color: rgba(14,14,14,0.25); }
  .kp-amount .sym { font-size: 30px; opacity: 0.55; }
  .kp-clear { font-size: 10px; font-weight: 700; letter-spacing: 0.14em; color: rgba(14,14,14,0.5); }
  .kp-toprow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .kp-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .kp-cats {
    display: flex; gap: 6px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    padding: 2px 18px;
    margin: 8px -18px 0;
    -webkit-overflow-scrolling: touch;
  }
  .kp-cats::-webkit-scrollbar { display: none; }
  .kp-cat {
    flex-shrink: 0;
    scroll-snap-align: start;
    padding: 6px 12px;
    border: 2px solid #0e0e0e;
    border-radius: 999px;
    background: transparent; color: #0e0e0e;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    transition: transform 0.04s, box-shadow 0.04s, background 0.04s;
  }
  .kp-cat:active { transform: translate(1px, 1px); }
  .kp-cat.active { background: #e9c44b; box-shadow: 2px 2px 0 #0e0e0e; }
  .kp-sym-btn {
    background: transparent; padding: 0; cursor: pointer;
    font: inherit; color: inherit;
  }
  .kp-payers {
    display: flex; justify-content: space-around; align-items: center;
    padding: 10px 18px;
    background: #fffaf0;
    flex-shrink: 0;
  }
  .kp-payer { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .kp-payer-name { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(14,14,14,0.5); }
  .kp-payer.active .kp-payer-name { color: #0e0e0e; }
  .kp-card-bar {
    background: #0e0e0e; color: #e9c44b;
    padding: 8px 18px;
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    display: flex; justify-content: space-between; align-items: center;
    flex-shrink: 0;
  }
  .kp-card-bar .swap { color: rgba(233,196,75,0.7); font-size: 10px; font-weight: 700; letter-spacing: 0.14em; }
  .kp-pad {
    background: #e9c44b;
    padding: 12px 14px 14px;
    flex: 1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(4, 1fr) auto;
    gap: 7px;
    min-height: 0;
    overflow: hidden;
  }
  .kp-cta { grid-column: 1 / -1; margin-top: 4px; }

  /* ─────────────────────────── LEDGER (timeline) ─────────────────────────── */
  .led-filters { display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 2px solid #0e0e0e; }
  .led-filter {
    padding: 12px 8px; text-align: center;
    font-size: 10px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: rgba(14,14,14,0.5);
    border-right: 1.5px solid rgba(14,14,14,0.12);
    background: #fffaf0;
  }
  .led-filter:last-child { border-right: none; }
  .led-filter.active { background: #e9c44b; color: #0e0e0e; }
  .led-day-band {
    background: #e9c44b; border-top: 2px solid #0e0e0e; border-bottom: 2px solid #0e0e0e;
    padding: 8px 22px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .led-day-band.dim { background: #f1ecdf; }
  .led-day-band .lbl { font-family: 'Funnel Display'; font-weight: 800; font-size: 14px; letter-spacing: 0.05em; text-transform: uppercase; }
  .led-day-band .sub { font-size: 10px; color: rgba(14,14,14,0.55); font-weight: 600; letter-spacing: 0.04em; }
  .led-day-band .total { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 16px; }
  .led-row { display: flex; gap: 12px; align-items: center; padding: 12px 22px; background: #fffaf0; border-bottom: 1.5px solid rgba(14,14,14,0.07); transition: background 0.4s; }
  .led-row.fresh { background: #fff5d6; animation: freshFlash 1.4s ease-out; }
  @keyframes freshFlash {
    0%   { background: #e9c44b; }
    100% { background: #fffaf0; }
  }
  .led-row-title { font-size: 14px; font-weight: 600; line-height: 1.2; }
  .led-row-sub { font-size: 11px; color: rgba(14,14,14,0.55); font-weight: 500; margin-top: 3px; letter-spacing: 0.02em; }
  .led-row-amt { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 16px; text-align: right; line-height: 1.1; }
  .led-row-amt .dec { font-size: 11px; color: rgba(14,14,14,0.5); }

  /* ─────────────────────────── SUMMARY (dashboard) ─────────────────────────── */
  .sum-totals { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 2px solid #0e0e0e; }
  .sum-total { padding: 18px 18px 16px; border-right: 2px solid #0e0e0e; }
  .sum-total:last-child { border-right: none; background: #fffaf0; }
  .sum-total.primary { background: #e9c44b; }
  .sum-total .lbl { font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(14,14,14,0.6); }
  .sum-total .amt { font-family: 'Funnel Display'; font-weight: 800; font-size: 32px; letter-spacing: -0.02em; margin-top: 4px; }
  .sum-total .meta { font-size: 11px; color: rgba(14,14,14,0.6); margin-top: 6px; font-weight: 500; }
  .sum-cat-row { padding: 12px 22px 14px; background: #fffaf0; border-bottom: 1.5px solid rgba(14,14,14,0.07); }
  .sum-cat-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .sum-cat-name { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; gap: 6px; }
  .sum-cat-amt { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 13px; text-align: right; }
  .sum-cat-amt .sub { display: block; font-size: 11px; color: rgba(14,14,14,0.5); font-weight: 500; }
  .sum-bar { height: 8px; background: #f1ecdf; border: 1.5px solid #0e0e0e; display: flex; }
  .sum-bar-fill { height: 100%; }
  .sum-bar-fill.gbp { background: #0e0e0e; }
  .sum-bar-fill.inr { background: #c0392b; }
  .sum-who-row { padding: 12px 22px; background: #fffaf0; border-bottom: 1.5px solid rgba(14,14,14,0.07); display: flex; gap: 12px; align-items: center; }
  .sum-who-bar-wrap { flex: 1; }
  .sum-who-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
  .sum-who-name { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }

  /* ─────────────────────────── TOMORROW ─────────────────────────── */
  .tom-weather { background: #e9c44b; padding: 14px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #0e0e0e; }
  .tom-weather .tmp { font-family: 'Funnel Display'; font-weight: 800; font-size: 22px; }
  .tom-weather .meta { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; color: rgba(14,14,14,0.7); margin-top: 3px; text-transform: uppercase; }
  .tom-weather .sun { text-align: right; }
  .tom-weather .sun .lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: rgba(14,14,14,0.6); }
  .tom-weather .sun .val { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 16px; margin-top: 2px; }

  .tom-event { padding: 14px 22px; background: #fffaf0; border-bottom: 1.5px solid rgba(14,14,14,0.07); display: flex; gap: 14px; align-items: flex-start; }
  .tom-event-time { font-family: 'IBM Plex Mono'; font-weight: 700; font-size: 14px; min-width: 44px; padding-top: 2px; }
  .tom-event-body { flex: 1; min-width: 0; }
  .tom-event-title { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .tom-event-tag {
    display: inline-block; margin-top: 6px;
    background: #e9c44b; color: #0e0e0e;
    padding: 3px 8px; border-radius: 999px;
    border: 1.5px solid #0e0e0e;
    font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  }
  .tom-check {
    width: 24px; height: 24px; border-radius: 50%;
    border: 2px solid #0e0e0e;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 2px;
    cursor: pointer;
  }
  .tom-check.done { background: #0e0e0e; color: #e9c44b; }
  .tom-vault-item {
    padding: 14px 22px; background: #fffaf0;
    border-bottom: 1.5px solid rgba(14,14,14,0.07);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .tom-vault-name { font-size: 13px; font-weight: 600; }
  .tom-vault-meta { font-size: 11px; color: rgba(14,14,14,0.5); margin-top: 2px; font-weight: 500; }
  .tom-vault-arrow { width: 28px; height: 28px; border: 2px solid #0e0e0e; border-radius: 4px; display: flex; align-items: center; justify-content: center; }

  /* event add inline */
  .tom-add-bar { padding: 14px 22px; background: #f1ecdf; border-bottom: 1.5px solid rgba(14,14,14,0.1); display: flex; align-items: center; gap: 10px; }
  .tom-add-bar input {
    flex: 1; background: #fffaf0; border: 2px solid #0e0e0e; border-radius: 4px;
    padding: 10px 12px; font-size: 13px; font-weight: 500; outline: none;
  }
  .tom-add-bar button {
    background: #0e0e0e; color: #e9c44b;
    border: 2px solid #0e0e0e; border-radius: 4px;
    padding: 10px 16px; font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  }

  /* ─────────────────────────── SHEET / MODAL ─────────────────────────── */
  .backdrop {
    position: absolute; inset: 0; background: rgba(14,14,14,0.45);
    z-index: 100;
    animation: fadeIn 0.18s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #fffaf0;
    border-top: 2px solid #0e0e0e;
    z-index: 101;
    animation: slideUp 0.26s cubic-bezier(0.2, 0.7, 0.3, 1);
    padding: 22px;
  }
  .sheet-title { font-family: 'Funnel Display'; font-weight: 800; font-size: 18px; letter-spacing: 0.02em; text-transform: uppercase; margin-bottom: 4px; }
  .sheet-sub { font-size: 11px; color: rgba(14,14,14,0.6); letter-spacing: 0.06em; text-transform: uppercase; font-weight: 600; margin-bottom: 16px; }
  .sheet-opt {
    padding: 14px;
    border: 2px solid #0e0e0e;
    border-radius: 4px;
    margin-bottom: 10px;
    background: #fffaf0;
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
    transition: transform 0.04s, box-shadow 0.04s;
  }
  .sheet-opt:hover { box-shadow: 3px 3px 0 #0e0e0e; }
  .sheet-opt.selected { background: #e9c44b; box-shadow: 3px 3px 0 #0e0e0e; }
  .sheet-opt-label { font-family: 'Funnel Display'; font-weight: 700; font-size: 15px; letter-spacing: 0.02em; }
  .sheet-opt-sub { font-size: 11px; color: rgba(14,14,14,0.6); margin-top: 3px; }
  .sheet-opt-mark {
    width: 22px; height: 22px; border: 2px solid #0e0e0e;
    border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: #fffaf0;
  }
  .sheet-opt.selected .sheet-opt-mark { background: #0e0e0e; color: #e9c44b; }

  /* settings */
  .settings-row {
    padding: 14px 22px; background: #fffaf0;
    border-bottom: 1.5px solid rgba(14,14,14,0.08);
    display: flex; justify-content: space-between; align-items: center;
    cursor: pointer;
  }

const { useState, useMemo, useEffect, useRef } = React;

/* ════════════════════════════════════════════════════════════════════
   PERSISTENCE & NETWORK
   ════════════════════════════════════════════════════════════════════ */

function cleanForStorage(value) {
  // Strip photo data URLs (huge) before persisting; keep a `hasPhoto` flag.
  if (Array.isArray(value)) {
    return value.map((item) => {
      if (item && typeof item === 'object' && 'photo' in item) {
        const { photo, ...rest } = item;
        return { ...rest, hasPhoto: !!photo };
      }
      return item;
    });
  }
  return value;
}

function writeNow(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(cleanForStorage(value)));
    return true;
  } catch (e) {
    console.warn('persist failed', key, e);
    return false;
  }
}

/* IndexedDB for photo data URLs (too large for localStorage) */
const IDB_NAME = 'dadpaid';
const IDB_STORE = 'photos';

function openPhotoDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function putPhoto(id, dataUrl) {
  try {
    const db = await openPhotoDB();
    await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).put(dataUrl, id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  } catch (e) { console.warn('putPhoto failed', e); }
}

async function getPhoto(id) {
  try {
    const db = await openPhotoDB();
    return await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readonly');
      const req = tx.objectStore(IDB_STORE).get(id);
      req.onsuccess = () => res(req.result || null);
      req.onerror = () => rej(req.error);
    });
  } catch (e) { console.warn('getPhoto failed', e); return null; }
}

async function deletePhoto(id) {
  try {
    const db = await openPhotoDB();
    await new Promise((res, rej) => {
      const tx = db.transaction(IDB_STORE, 'readwrite');
      tx.objectStore(IDB_STORE).delete(id);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  } catch (e) { console.warn('deletePhoto failed', e); }
}

function usePhoto(id, hasPhoto) {
  const [src, setSrc] = useState(null);
  useEffect(() => {
    if (!id || !hasPhoto) { setSrc(null); return; }
    let alive = true;
    getPhoto(id).then((url) => { if (alive) setSrc(url); });
    return () => { alive = false; };
  }, [id, hasPhoto]);
  return src;
}

function usePersistedState(key, initial) {
  const [state, setStateRaw] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      if (raw == null) return initial;
      return JSON.parse(raw);
    } catch { return initial; }
  });

  // Wrap setState so EVERY mutation writes to localStorage synchronously,
  // before React schedules the re-render. This means a refresh immediately
  // after an action will always see the latest data.
  const setState = (next) => {
    setStateRaw((prev) => {
      const resolved = typeof next === 'function' ? next(prev) : next;
      writeNow(key, resolved);
      return resolved;
    });
  };

  // Also persist once on mount in case seed data was just hydrated.
  useEffect(() => {
    writeNow(key, state);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  return [state, setState];
}

function useOnline() {
  const [online, setOnline] = useState(typeof navigator !== 'undefined' ? navigator.onLine : true);
  useEffect(() => {
    const up = () => setOnline(true);
    const down = () => setOnline(false);
    window.addEventListener('online', up);
    window.addEventListener('offline', down);
    return () => {
      window.removeEventListener('online', up);
      window.removeEventListener('offline', down);
    };
  }, []);
  return online;
}

const SUPABASE_URL  = 'https://jmkuygwmwbxhgyberhvb.supabase.co';

function useAuth() {
  const [user, setUser] = useState(null);

    sb.auth.getSession().then(({ data }) => {

    });
    const { data: { subscription } } = sb.auth.onAuthStateChange((_e, session) => {

    });
    return () => { alive = false; subscription.unsubscribe(); };
  }, []);

}

/* DB ↔ client field mapping (DB uses snake_case + _id suffixes). */
function expenseFromDB(e) {

}
function expenseToDB(e, tripId) {

/* Loader: pulls family/members/cards/active trip/expenses/events/vault. */
async function loadAll() {
  const { data: fams, error: fErr } = await sb.from('families').select('*').limit(1);
  if (fErr || !fams?.length) return null;
  const fam = fams[0];
  const [{ data: members }, { data: cards }, { data: trips }] = await Promise.all([
    sb.from('family_members').select('*').eq('family_id', fam.id).order('position'),
    sb.from('family_cards').select('*').eq('family_id', fam.id).order('position'),
    sb.from('trips').select('*').eq('family_id', fam.id).eq('status', 'active').order('start_date', { ascending: false }).limit(1),
  ]);
  if (!trips?.length) return { family: fam, members: members || [], cards: cards || [], trip: null, expenses: [], events: [], vault: [] };
  const trip = trips[0];
  const [{ data: exps }, { data: evs }, { data: vlt }] = await Promise.all([
    sb.from('expenses').select('*').eq('trip_id', trip.id).order('date', { ascending: false }),
    sb.from('events').select('*').eq('trip_id', trip.id).order('time'),
    sb.from('vault_items').select('*').eq('trip_id', trip.id),
  ]);
  return { family: fam, members: members || [], cards: cards || [], trip, expenses: exps || [], events: evs || [], vault: vlt || [] };
}

/* Mutate FAMILY/TRIP module-level vars from Supabase shape. */
function applyServerSnapshot(snap) {
  FAMILY = {

    TRIP = {
      ...TRIP,
      id: snap.trip.id,
      name: snap.trip.name,
      shortName: snap.trip.short_name || snap.trip.name,
      startDate: snap.trip.start_date,
      endDate:   snap.trip.end_date,
      totalDays: days,
      currentDay: TRIP.currentDay,
      currencies: [snap.trip.primary_currency],
      defaultSplit: snap.trip.default_split,
    };
  }
}

/* Photo upload: data-URL → blob → storage. Returns storage path. */
async function uploadPhotoFromDataUrl(dataUrl, familyId, expenseId) {
  try {
    const m = dataUrl.match(/^data:(image\/[^;]+);base64,(.+)$/);
    if (!m) return null;
    const mime = m[1]; const ext = mime.split('/')[1] || 'jpg';
    const bytes = Uint8Array.from(atob(m[2]), (c) => c.charCodeAt(0));
    const blob = new Blob([bytes], { type: mime });
    const path = `${familyId}/${expenseId}.${ext}`;
    const { error } = await sb.storage.from('photos').upload(path, blob, { upsert: true, contentType: mime });
    if (error) { console.warn('photo upload failed', error); return null; }
    return path;
  } catch (e) { console.warn('photo upload threw', e); return null; }
}

async function fetchPhotoFromStorage(path) {
  if (!path) return null;
  const { data, error } = await sb.storage.from('photos').createSignedUrl(path, 3600);
  if (error || !data?.signedUrl) return null;
  return data.signedUrl;
}

/* ════════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════════ */

function fmtMajor(integerMinor, currency) {
  const n = Math.abs(integerMinor);
  const major = Math.floor(n / 100);
  if (currency === 'INR') {
    const s = major.toString();
    if (s.length <= 3) return s;
    const last3 = s.slice(-3);
    const rest = s.slice(0, -3);
    return rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',') + ',' + last3;
  }
  return major.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function fmtMinor(integerMinor) { return (Math.abs(integerMinor) % 100).toString().padStart(2, '0'); }
function symbol(c) { return c === 'INR' ? '₹' : '£'; }

function fmtFull(minorAmount, currency, opts = {}) {
  const sym = symbol(currency);
  const maj = fmtMajor(minorAmount, currency);
  const min = fmtMinor(minorAmount);
  if (opts.compact && min === '00') return `${sym}${maj}`;
  return `${sym}${maj}.${min}`;
}

function dayLabel(dateStr, currentDateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const today = new Date(currentDateStr + 'T00:00:00');
  const diff = Math.round((today - d) / 86400000);
  if (diff === 0) return 'TODAY';
  if (diff === 1) return 'YESTERDAY';
  return d.toLocaleDateString('en-GB', { weekday: 'long' }).toUpperCase() + ' ' + d.getDate();
}

function memberOf(id) { return FAMILY.members.find(m => m.id === id); }
function cardsOf(payerId) { return FAMILY.cards.filter(c => c.owner === payerId); }
function cardOf(cardId) { return FAMILY.cards.find(c => c.id === cardId); }

function totalFor(expenses, opts = {}) {
  let total = 0;
  for (const e of expenses) {
    if (opts.currency && e.currency !== opts.currency) continue;
    if (opts.payer && e.payer !== opts.payer) continue;
    if (opts.category && e.category !== opts.category) continue;
    if (opts.preTrip === true && !e.preTrip) continue;
    if (opts.preTrip === false && e.preTrip) continue;
    if (opts.date && e.date !== opts.date) continue;
    total += e.amount;
  }
  return total;
}

  { id: 'parents',  label: 'PARENTS',    sub: 'Ami + Ketan · Sahil goes free' },

function KeypadScreen({ expenses, todayDate, online, onAdd, onToast, onGear }) {
  const [amount, setAmount] = useState('');           // raw string: "12" or "12.5" or "12.50"
  const [currency, setCurrency] = useState('GBP');
  const [category, setCategory] = useState('Food');
  const [payer, setPayer] = useState('ketan');
  const [card, setCard] = useState('hdfc');
  const [split, setSplit] = useState(TRIP.defaultSplit);
  const [splitOpen, setSplitOpen] = useState(false);
  const [photo, setPhoto] = useState(null); // dataURL string
  const fileRef = useRef(null);

  // payer change → pick first card for that payer
  useEffect(() => {
    const cards = cardsOf(payer);
    if (!cards.find(c => c.id === card)) setCard(cards[0]?.id);
  }, [payer]);

  const cardObj = cardOf(card);
  const minorAmount = Math.round(parseFloat(amount || '0') * 100);
  const isZero = minorAmount === 0;
  const todayTotal = totalFor(expenses, { date: todayDate, currency: 'GBP' });

  // parse display parts
  const [majorStr, decStr] = amount.split('.');
  const hasDot = amount.includes('.');
  const majorDisplay = amount ? fmtMajor(parseInt(majorStr || '0', 10) * 100, currency) : '0';

  function press(d) {
    // cap raw length
    if (amount.length >= 12) return;
    // cap decimal places to 2
    if (hasDot) {
      const dec = amount.split('.')[1] || '';
      if (dec.length >= 2) return;
    }
    // block leading zeros like "00" but allow "0." and "0.5"
    if (amount === '0' && d !== '0') {
      setAmount(d);
      return;
    }
    if (!amount && d === '0') {
      setAmount('0');
      return;
    }
    setAmount(amount + d);
  }
  function decimal() {
    if (hasDot) return;
    setAmount((amount || '0') + '.');
  }
  function del() {
    setAmount(amount.slice(0, -1));
  }
  function clear() { setAmount(''); }

  function openCamera() {
    fileRef.current?.click();
  }
  function onPhotoPicked(ev) {
    const file = ev.target.files?.[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      setPhoto(reader.result);
      onToast('📎 Photo attached');
    };
    reader.readAsDataURL(file);
    ev.target.value = ''; // allow re-pick of same file
  }
  function clearPhoto() { setPhoto(null); }

  function submit() {
    if (isZero) return;
    const now = Date.now();
    const e = {
      id: 'e' + now,
      ts: now, // for sort order
      date: todayDate,
      payer, card,
      amount: minorAmount,
      currency,
      title: category,
      category,
      split,
      photo,
    };
    onAdd(e);
    const m = memberOf(payer);
    onToast(`+ ${fmtFull(minorAmount, currency)} · ${m.name}`);
    setAmount('');
    setPhoto(null);
  }

  return (
    <>
      <Header
        title="DAD PAID"
        sub={`${TRIP.shortName} · ${fmtFull(todayTotal, 'GBP')} so far today`}
        right={`D ${TRIP.currentDay} / ${TRIP.totalDays}`}
        onGear={onGear}
        offline={!online}
      />

      <div className="kp-body">
        {/* AMOUNT */}
        <div className="kp-top">
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap: 10}}>
            <div className={`kp-amount ${isZero ? 'zero' : ''}`}>
              <button
                className="kp-sym-btn sym"
                onClick={() => setCurrency(currency === 'GBP' ? 'INR' : 'GBP')}
                aria-label="toggle currency"
              >{symbol(currency)}</button>
              {amount === '' ? (
                <span>0</span>
              ) : (
                <span>{majorDisplay}{hasDot && '.'}{decStr || ''}</span>
              )}
            </div>
            {!isZero && <button className="kp-clear" onClick={clear} style={{flexShrink:0}}>CLEAR ✕</button>}
          </div>

          {/* category horizontal scroll */}
          <div className="kp-cats">
            {CATEGORIES.map(c => (
              <button
                key={c}
                className={`kp-cat ${category === c ? 'active' : ''}`}
                onClick={() => setCategory(c)}
              >
                {c.toUpperCase()}
              </button>
            ))}
          </div>

          {/* split + photo */}
          <div style={{display:'flex', gap: 8, marginTop: 8}}>
            <button
              className="chip chip-active"
              onClick={() => setSplitOpen(true)}
              style={{flex: 1, justifyContent:'space-between'}}
            >
              <span>SPLIT · {SPLIT_OPTIONS.find(o => o.id === split).label}</span>
              <span>▾</span>
            </button>
            <button
              className={`chip ${photo ? 'chip-active' : ''}`}
              onClick={openCamera}
              aria-label="attach photo"
              style={{flexShrink:0, padding: '6px 12px'}}
            >
              {photo ? '📎 PHOTO' : '+ 📎'}
            </button>
          </div>
        </div>

        {/* PAYERS */}
        <div className="kp-payers">
          {FAMILY.members.map(m => (
            <button key={m.id} className={`kp-payer ${payer === m.id ? 'active' : ''}`} onClick={() => setPayer(m.id)}>
              <Avatar id={m.id} size="lg" selected={payer === m.id} />
              <div className="kp-payer-name">{m.name}</div>
            </button>
          ))}
        </div>

        {/* CARD BAR */}
        <div className="kp-card-bar">
          <span>■ {cardObj ? `${cardObj.nick.toUpperCase()}${cardObj.last4 ? ' · ' + cardObj.last4 : ''}` : 'NO CARD'}</span>
          <button className="swap" onClick={() => {
            const cards = cardsOf(payer);
            const idx = cards.findIndex(c => c.id === card);
            setCard(cards[(idx + 1) % cards.length].id);
          }}>SWAP ›</button>
        </div>

        {/* KEYPAD */}
        <div className="kp-pad">
          {[1,2,3,4,5,6,7,8,9].map(n => (
            <button key={n} className="key" onClick={() => press(String(n))}>{n}</button>
          ))}
          <button className="key" onClick={decimal} aria-label="decimal point">.</button>
          <button className="key" onClick={() => press('0')}>0</button>
          <button className="key" onClick={del}>
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/>
              <line x1="18" y1="9" x2="12" y2="15"/>
              <line x1="12" y1="9" x2="18" y2="15"/>
            </svg>
          </button>
          <input
            ref={fileRef}
            type="file"
            accept="image/*"
            capture="environment"
            onChange={onPhotoPicked}
            style={{display:'none'}}
          />
          <button className={`cta kp-cta ${isZero ? 'cta-disabled' : ''}`} onClick={submit}>
            ADD →
          </button>
        </div>
      </div>

      {/* SPLIT SHEET */}
      {splitOpen && (
        <>
          <div className="backdrop" onClick={() => setSplitOpen(false)} />
          <div className="sheet">
            <div className="sheet-title">SPLIT</div>
            <div className="sheet-sub">Who's this expense for?</div>
            {SPLIT_OPTIONS.map(o => (
              <div key={o.id} className={`sheet-opt ${split === o.id ? 'selected' : ''}`} onClick={() => { setSplit(o.id); setTimeout(() => setSplitOpen(false), 120); }}>
                <div>
                  <div className="sheet-opt-label">{o.label}</div>
                  <div className="sheet-opt-sub">{o.sub}</div>
                </div>
                <div className="sheet-opt-mark">{split === o.id ? '✓' : ''}</div>
              </div>
            ))}
          </div>
        </>
      )}

    </>
  );
}

function LedgerScreen({ expenses, todayDate, online, onGear, onOpenPhoto }) {
  const [filter, setFilter] = useState('all'); // all | mine | gbp | inr
  const filtered = useMemo(() => {
    return expenses.filter(e => {
      if (filter === 'gbp' && e.currency !== 'GBP') return false;
      if (filter === 'inr' && e.currency !== 'INR') return false;
      return true;
    });
  }, [expenses, filter]);

  const preTrip = filtered.filter(e => e.preTrip);
  const inTrip  = filtered.filter(e => !e.preTrip);

  // group in-trip by date, descending; within day, newest first
  const byDate = useMemo(() => {
    const map = {};
    for (const e of inTrip) {
      map[e.date] = map[e.date] || [];
      map[e.date].push(e);
    }
    const dates = Object.keys(map).sort((a, b) => b.localeCompare(a));
    return dates.map(d => ({
      date: d,
      items: map[d].sort((a, b) => (b.ts || 0) - (a.ts || 0) || b.id.localeCompare(a.id))
    }));
  }, [inTrip]);

  const totalAll = totalFor(filtered, { currency: 'GBP' });

  return (
    <>
      <Header
        title="THE LEDGER"
        sub={`${TRIP.shortName} · DAY ${TRIP.currentDay} OF ${TRIP.totalDays}`}
        right={`${expenses.length}`}
        rightSub="ENTRIES"
        onGear={onGear}
        offline={!online}
      />

      <div className="body">
        <div className="led-filters">
          {[['all','ALL'],['mine','MINE'],['gbp','£ GBP'],['inr','₹ INR']].map(([id, lbl]) => (
            <button key={id} className={`led-filter ${filter === id ? 'active' : ''}`} onClick={() => setFilter(id)}>{lbl}</button>
          ))}
        </div>

        {/* Pre-trip */}
        {preTrip.length > 0 && (
          <>
            <div className="led-day-band dim">
              <div>
                <div className="lbl">BEFORE TRIP</div>
                <div className="sub">Hotels · flights · advance</div>
              </div>
              <div className="total">{fmtFull(totalFor(preTrip, { currency: 'GBP' }), 'GBP', { compact: true })}</div>
            </div>
            {preTrip.map(e => <LedgerRow key={e.id} e={e} onOpenPhoto={onOpenPhoto} />)}
          </>
        )}

        {/* By day */}
        {byDate.map(({ date, items }) => {
          const dt = totalFor(items, { currency: 'GBP' });
          return (
            <div key={date}>
              <div className={`led-day-band ${date !== todayDate ? 'dim' : ''}`}>
                <div>
                  <div className="lbl">{dayLabel(date, todayDate)}</div>
                  <div className="sub">{date}</div>
                </div>
                <div className="total">{fmtFull(dt, 'GBP', { compact: true })}</div>
              </div>
              {items.map(e => <LedgerRow key={e.id} e={e} onOpenPhoto={onOpenPhoto} />)}
            </div>
          );
        })}

        <div style={{padding: '24px 22px', textAlign:'center', fontSize:11, fontWeight:600, letterSpacing:'0.12em', textTransform:'uppercase', color:'rgba(14,14,14,0.45)'}}>
          ── end of ledger ── trip total {fmtFull(totalAll, 'GBP')} ──
        </div>
      </div>
    </>
  );
}

function LedgerRow({ e, onOpenPhoto }) {
  const m = memberOf(e.payer);
  const fresh = e.ts && (Date.now() - e.ts < 2000);
  const unsynced = e.synced === false;
  const hasPhoto = e.hasPhoto || e.photo;

function Settlement({ expenses }) {
  // Compute net per person per currency assuming default split per expense.
  // Simplified: split rule on each expense — defaults to 'everyone'.
  const SPLIT_BENEFICIARIES = {
    'everyone': ['ami','sahil','ketan'],
    'parents':  ['ami','ketan'],
    'dad':      ['ketan'],
    'just-me':  null, // payer only
  };

  function settleFor(currency) {
    const net = { ami: 0, sahil: 0, ketan: 0 }; // positive = owed to them
    for (const e of expenses) {
      if (e.currency !== currency) continue;
      const splitId = e.split || 'everyone';
      const benefs = SPLIT_BENEFICIARIES[splitId] || [e.payer];
      const perHead = e.amount / benefs.length;
      net[e.payer] += e.amount;
      for (const b of benefs) net[b] -= perHead;
    }
    // turn into transfers using min-cash-flow simplified greedy
    const debtors = [];
    const creditors = [];
    for (const id of Object.keys(net)) {
      if (net[id] < -1) debtors.push({ id, v: -net[id] });
      else if (net[id] > 1) creditors.push({ id, v: net[id] });
    }
    debtors.sort((a, b) => b.v - a.v);
    creditors.sort((a, b) => b.v - a.v);
    const transfers = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const amt = Math.min(debtors[i].v, creditors[j].v);
      transfers.push({ from: debtors[i].id, to: creditors[j].id, amount: amt });
      debtors[i].v -= amt;
      creditors[j].v -= amt;
      if (debtors[i].v < 1) i++;
      if (creditors[j].v < 1) j++;
    }
    return transfers;
  }

  const gbpT = settleFor('GBP');
  const inrT = settleFor('INR');
  const all = [...gbpT.map(t => ({...t, currency:'GBP'})), ...inrT.map(t => ({...t, currency:'INR'}))];

  if (all.length === 0) {
    return (
      <div className="row" style={{justifyContent:'center', color:'rgba(14,14,14,0.5)', fontSize:13, fontWeight:600, fontStyle:'italic'}}>
        Everyone's even. Suspicious.
      </div>
    );
  }

  return (
    <>
      {all.map((t, idx) => (
        <div key={idx} className="row">
          <Avatar id={t.from} />
          <div style={{flex: 1, fontSize: 13, fontWeight: 600}}>
            <span style={{fontWeight: 700}}>{memberOf(t.from).name}</span>
            <span style={{color:'rgba(14,14,14,0.5)'}}> owes </span>
            <span style={{fontWeight: 700}}>{memberOf(t.to).name}</span>
          </div>
          <div className="led-row-amt" style={{color:'#c0392b'}}>
            {symbol(t.currency)}{fmtMajor(Math.round(t.amount), t.currency)}<span className="dec">.{fmtMinor(Math.round(t.amount))}</span>
          </div>
        </div>
      ))}
    </>
  );
}

function App() {
  const { user, loading: authLoading } = useAuth();
  const online = useOnline();
  const [bootDone, setBootDone] = useState(false);
  const [, bumpVersion] = useState(0);                 // force re-render after FAMILY/TRIP mutate
  const forceRender = () => bumpVersion((v) => v + 1);

  const [tab, setTab] = useState('add');
  const [overlay, setOverlay] = useState(null);        // null | 'settings' | 'wrap'
  const [photoExpense, setPhotoExpense] = useState(null);

  // Offline-tolerant cache. Hydrates from localStorage instantly; replaced by server on load.
  const [expenses, setExpenses] = usePersistedState('dp.expenses', []);
  const [events,   setEvents]   = usePersistedState('dp.events',   []);
  const [vault,    setVault]    = usePersistedState('dp.vault',    []);

  // Pending-ops queue — every mutation is appended; drained when online + authed.
  const [pendingOps, setPendingOps] = usePersistedState('dp.pending', []);

  const [toast, setToast] = useState(null);
  const todayDate = new Date().toISOString().slice(0, 10);

  function showToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(null), 2200);
  }

  /* ── INITIAL LOAD ────────────────────────────────────────────────── */
  useEffect(() => {
    if (!user || !online) { if (!user) setBootDone(true); return; }
    let alive = true;
    (async () => {
      try {
        const snap = await loadAll();
        if (!alive) return;
        if (snap) {
          applyServerSnapshot(snap);
          setExpenses(snap.expenses.map(expenseFromDB));
          setEvents(snap.events.map(eventFromDB));
          setVault(snap.vault.map((v) => ({ id: v.id, name: v.name, meta: v.meta || '' })));
          // Compute "current day of trip" relative to today.
          if (snap.trip) {
            const startMs = new Date(snap.trip.start_date).getTime();
            const todayMs = new Date(todayDate).getTime();
            const day = Math.max(1, Math.min(TRIP.totalDays, Math.floor((todayMs - startMs) / 86400000) + 1));
            TRIP.currentDay = day;
          }
          forceRender();
        }
      } catch (e) { console.warn('initial load failed', e); }
      setBootDone(true);
    })();
    return () => { alive = false; };
  }, [user, online]);

  /* ── WRITE QUEUE FLUSHER ─────────────────────────────────────────── */
  const flushing = useRef(false);
  useEffect(() => {
    if (!user || !online || pendingOps.length === 0 || flushing.current) return;
    flushing.current = true;
    (async () => {
      const ops = pendingOps;
      const remaining = [];
      let flushed = 0;
      for (const op of ops) {
        try {
          await runQueuedOp(op);
          flushed++;
          // mark synced in local state
          if (op.type === 'expense.insert' || op.type === 'expense.update') {
            setExpenses((prev) => prev.map((e) => e.id === op.payload.id ? { ...e, synced: true } : e));
          } else if (op.type === 'event.insert' || op.type === 'event.update') {
            setEvents((prev) => prev.map((v) => v.id === op.payload.id ? { ...v, synced: true } : v));
          }
        } catch (e) {
          remaining.push({ ...op, attempts: (op.attempts || 0) + 1, lastError: String(e?.message || e) });
        }
      }
      setPendingOps(remaining);
      flushing.current = false;
      if (flushed > 0) showToast(`Synced ${flushed} ${flushed === 1 ? 'entry' : 'entries'}`);
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [user, online, pendingOps.length]);

  /* ── REALTIME ────────────────────────────────────────────────────── */
  useEffect(() => {
    if (!user || !TRIP.id) return;
    const ch = sb.channel(`trip:${TRIP.id}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'expenses', filter: `trip_id=eq.${TRIP.id}` }, (p) => {
        if (p.eventType === 'DELETE') {
          setExpenses((prev) => prev.filter((e) => e.id !== p.old.id));
        } else {
          const incoming = expenseFromDB(p.new);
          setExpenses((prev) => {
            const ix = prev.findIndex((e) => e.id === incoming.id);
            if (ix === -1) return [...prev, incoming];
            const next = prev.slice(); next[ix] = { ...next[ix], ...incoming }; return next;
          });
        }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'events', filter: `trip_id=eq.${TRIP.id}` }, (p) => {
        if (p.eventType === 'DELETE') {
          setEvents((prev) => prev.filter((e) => e.id !== p.old.id));
        } else {
          const incoming = eventFromDB(p.new);
          setEvents((prev) => {
            const ix = prev.findIndex((e) => e.id === incoming.id);
            if (ix === -1) return [...prev, incoming].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
            const next = prev.slice(); next[ix] = { ...next[ix], ...incoming }; return next;
          });
        }
      })
      .subscribe();
    return () => { sb.removeChannel(ch); };
  }, [user, TRIP.id]);

  /* ── MUTATIONS — optimistic + enqueue ────────────────────────────── */
  function enqueue(op) { setPendingOps((prev) => [...prev, op]); }

  async function runQueuedOp(op) {
    switch (op.type) {
      case 'expense.insert': {
        const { error } = await sb.from('expenses').insert(op.payload);
        if (error) throw error;
        // Storage upload if a photo was attached at insert time.
        if (op.photoDataUrl && FAMILY.id) {
          const path = await uploadPhotoFromDataUrl(op.photoDataUrl, FAMILY.id, op.payload.id);
          if (path) await sb.from('expenses').update({ has_photo: true, photo_path: path }).eq('id', op.payload.id);
        }
        return;
      }
      case 'event.insert': {
        const { error } = await sb.from('events').insert(op.payload);
        if (error) throw error;
        return;
      }
      case 'event.update': {
        const { error } = await sb.from('events').update(op.payload).eq('id', op.payload.id);
        if (error) throw error;
        return;
      }
      default: console.warn('unknown op', op.type);
    }
  }

  function addExpense(e) {
    const { photo, ...rest } = e;
    const record = { ...rest, hasPhoto: !!photo, synced: false };
    if (photo) putPhoto(e.id, photo); // local IDB so photo viewer works immediately
    setExpenses((prev) => [...prev, record]);
    enqueue({ type: 'expense.insert', payload: expenseToDB(record, TRIP.id), photoDataUrl: photo || null });
  }

  function addEvent(v) {
    const record = { ...v, synced: false };
    setEvents((prev) => [...prev, record].sort((a, b) => (a.time || '').localeCompare(b.time || '')));
    enqueue({ type: 'event.insert', payload: eventToDB(record, TRIP.id) });
  }

  function toggleEvent(id) {
    let updated = null;
    setEvents((prev) => prev.map((e) => {
      if (e.id !== id) return e;
      updated = { ...e, done: !e.done, synced: false };
      return updated;
    }));
    if (updated) enqueue({ type: 'event.update', payload: { id, done: updated.done } });
  }

  const openSettings = () => setOverlay('settings');
  const closeOverlay = () => setOverlay(null);
  const endTrip = () => setOverlay('wrap');

  async function signOut() {
    await sb.auth.signOut();
    // Clear all local app state so the next account starts clean.
    ['dp.expenses', 'dp.events', 'dp.vault', 'dp.pending'].forEach((k) => localStorage.removeItem(k));
    setExpenses([]); setEvents([]); setVault([]); setPendingOps([]);
    showToast('Signed out');
  }

  /* ── RENDER GATES ────────────────────────────────────────────────── */
  if (authLoading) {
    return <div className="stage"><div className="phone"><div className="island" /><div className="boot"><div className="boot-dot" /></div></div></div>;
  }
  if (!user) {
    return <div className="stage"><div className="phone"><div className="island" /><LoginScreen /></div></div>;
  }
  if (!bootDone) {
    return <div className="stage"><div className="phone"><div className="island" /><div className="boot"><div className="boot-dot" /></div></div></div>;
  }

  return (
    <div className="stage">
      <div className="phone">
        <div className="island" />
        <div className="screen">
          {!overlay && tab === 'add'     && <KeypadScreen   expenses={expenses} todayDate={todayDate} online={online} onAdd={addExpense} onToast={showToast} onGear={openSettings} />}
          {!overlay && tab === 'log'     && <LedgerScreen   expenses={expenses} todayDate={todayDate} online={online} onGear={openSettings} onOpenPhoto={setPhotoExpense} />}
          {!overlay && tab === 'summary' && <SummaryScreen  expenses={expenses} todayDate={todayDate} online={online} onGear={openSettings} />}
          {!overlay && tab === 'next'    && <TomorrowScreen events={events} vault={vault} online={online} onToggleEvent={toggleEvent} onAddEvent={addEvent} onGear={openSettings} />}
          {overlay === 'settings' && <SettingsScreen expenses={expenses} online={online} pendingCount={pendingOps.length} userEmail={user.email} onBack={closeOverlay} onEndTrip={endTrip} onToast={showToast} onSignOut={signOut} />}
          {overlay === 'wrap'     && <TripWrapScreen expenses={expenses} onBack={closeOverlay} onToast={showToast} />}
          {!overlay && <BottomNav tab={tab} onTab={setTab} />}
        </div>
        <div className="home-bar" />
        {toast && <div className="toast">{toast}</div>}
        {photoExpense && <PhotoLightbox expense={photoExpense} onClose={() => setPhotoExpense(null)} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
